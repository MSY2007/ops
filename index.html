<script>
/* ═══ DELETE UI + SMART DATES ═══ */
function confirmUI(msg){return new Promise(res=>{
 const o=document.createElement('div');o.className='cfmWrap';
 o.innerHTML='<div class="cfm"><div class="cfmIco">'+ICO.trash+'</div><b>Delete this?</b><span class="mut" style="font-size:13px">'+esc(msg)+'</span><div class="row" style="margin:0;justify-content:flex-end"><button class="btn ghost sm cNo">Cancel</button><button class="btn sm cYes" style="background:var(--red);color:#fff">Delete</button></div></div>';
 document.body.appendChild(o);
 requestAnimationFrame(()=>o.classList.add('on'));
 const key=e=>{if(e.key==='Escape')done(false)};
 const done=v=>{o.classList.remove('on');setTimeout(()=>o.remove(),180);document.removeEventListener('keydown',key);res(v)};
 document.addEventListener('keydown',key);
 o.querySelector('.cNo').onclick=()=>done(false);
 o.querySelector('.cYes').onclick=()=>done(true);
 o.addEventListener('click',e=>{if(e.target===o)done(false)});
 setTimeout(()=>{const b=o.querySelector('.cYes');if(b)b.focus()},80)})}
/* replace every destructive action with the modal */
Meals.del=async function(id){if(!await confirmUI('This meal entry will be removed.'))return;
 DB.set('meals',DB.get('meals',[]).filter(m=>m.id!==id));R('meals')};
Mood.del=async function(id){if(!await confirmUI('This mood entry will be removed.'))return;
 DB.set('moods',DB.get('moods',[]).filter(m=>m.id!==id));R('mood')};
Notes.del=async function(id){if(!await confirmUI('This journal entry will be removed.'))return;
 DB.set('notes',DB.get('notes',[]).filter(n=>n.id!==id));R('notes')};
Train.delWo=async function(id){if(!await confirmUI('This session will be removed from history.'))return;
 DB.set('wos',Train.wos().filter(w=>w.id!==id));R('train')};
Train.delEx=async function(id){if(!await confirmUI('Remove from library? Past sessions stay in history.'))return;
 DB.set('ex',Train.exs().filter(e=>e.id!==id));R('train')};
Train.delPic=async function(id){if(!await confirmUI('Delete this progress photo?'))return;
 Train.picks=Train.picks.filter(p=>p!==id);
 DB.set('pics',Train.pics().filter(p=>p.id!==id));R('train')};
Train.delRoutine=async function(id){if(!await confirmUI('Delete this routine?'))return;
 DB.set('routines',DB.get('routines',[]).filter(r=>r.id!==id));R('train')};
Train.delMeas=async function(id){if(!await confirmUI('Delete this measurement entry?'))return;
 DB.set('meas',Train.meas().filter(m=>m.id!==id));R('train')};
/* leading-date parser: 2026-08-02 · 2026/08/02 · 02/08/2026 · 02/08/26 · 26-08-02 (yy/mm/dd)
   dd/mm preferred (HK); flips to mm/dd automatically when only one reading is valid */
function leadDate(txt){
 const mk=(y,mo,da)=>{if(!(y>=1990&&y<=2100&&mo>=1&&mo<=12&&da>=1&&da<=31))return null;
  const d=new Date(y,mo-1,da);
  return (d.getFullYear()===y&&d.getMonth()===mo-1&&d.getDate()===da)?iso(d):null};
 const dm=(a,b)=>a>12&&b<=12?[a,b]:(b>12&&a<=12?[b,a]:[a,b]);
 let m;
 if(m=txt.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b\s*/)){
  const d=mk(+m[1],+m[2],+m[3]);if(d)return{d,rest:txt.slice(m[0].length)}}
 if(m=txt.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\b\s*/)){
  const p=dm(+m[1],+m[2]);const d=mk(+m[3],p[1],p[0]);if(d)return{d,rest:txt.slice(m[0].length)}}
 if(m=txt.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2})\b\s*/)){
  const a=+m[1],b=+m[2];
  if(a>=20){const d=mk(2000+a,b,+m[3]);if(d)return{d,rest:txt.slice(m[0].length)}}
  else{const p=dm(a,b);const d=mk(2000+ +m[3],p[1],p[0]);if(d)return{d,rest:txt.slice(m[0].length)}}}
 return null}
/* journal: back-date any entry by starting with a date */
Notes.add=function(f){const raw=new FormData(f).get('txt').trim();
 const a=DB.get('notes',[]);
 if(this.editId){const n=a.find(x=>x.id===this.editId);
  if(n){n.txt=raw;n.tags=[...this.tags];n.photo=this.tmp;n.edited=true}
  if(DB.set('notes',a)){toast('Entry updated');this.reset()}return false}
 const ld=leadDate(raw);
 const n={id:uid(),ts:Date.now(),d:ld?ld.d:TODAY(),t:now(),txt:ld?ld.rest:raw,tags:[...this.tags],photo:this.tmp};
 a.push(n);
 if(DB.set('notes',a)){toast(ld?'Saved · '+dayLbl(n.d):'Saved');this.reset()}return false};
/* progress photos: same parser replaces the old ISO-only rule */
Train.addPic=function(f){if(!this.tmp){toast('Pick a photo first','err');return false}
 let note=new FormData(f).get('note').trim();let d=TODAY();
 const ld=leadDate(note);
 if(ld){d=ld.d;note=ld.rest}
 const a=this.pics();a.push({id:uid(),d,ph:this.tmp,note});
 if(DB.set('pics',a)){this.tmp=null;this.picks=[];toast('Progress photo saved · '+dayLbl(d));R('train')}return false};
</script>

<script>
/* ═══ TASKS · due dates, priority, edit ═══ */
const Tasks={filter:'open',pri:1,editId:null,
 render(v){const all=DB.get('todos',[]),T=TODAY();
  const PRI=[['Low','#8aa1b8'],['Medium','var(--cyan)'],['High','var(--amber)'],['Xhigh','var(--red)']],pc=p=>(PRI[p]||PRI[0])[1];
  const dd=s=>{const[a,b,c]=s.split('-').map(Number),[x,y,z]=T.split('-').map(Number);return Math.round((new Date(a,b-1,c)-new Date(x,y-1,z))/864e5)};
  const open=all.filter(t=>!t.done),done=all.filter(t=>t.done);
  const od=open.filter(t=>t.due&&t.due<T).length,n=open.filter(t=>t.due===T).length;
  const e=this.editId?all.find(t=>t.id===this.editId):null;
  const srt=(a,b)=>(b.pri-a.pri)||((a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0)||b.ts-a.ts;
  const grp=[];
  if(this.filter!=='done'){
   grp.push(['Overdue','od',open.filter(t=>t.due&&t.due<T)],['Today','td',open.filter(t=>t.due===T)],['Upcoming','',open.filter(t=>t.due&&t.due>T)],['No date','',open.filter(t=>!t.due)])}
  if(this.filter!=='open')grp.push(['Done','',done]);
  const dueTag=t=>{if(!t.due)return'';const k=dd(t.due);
   if(t.done)return'<span class="dTag">'+dayLbl(t.due)+'</span>';
   if(k<0)return'<span class="dTag od">Overdue '+(-k)+'d · '+dayLbl(t.due)+'</span>';
   if(k===0)return'<span class="dTag td">Due today</span>';
   return'<span class="dTag">'+(k===1?'Tomorrow':'Due '+dayLbl(t.due))+'</span>'};
  const row=t=>'<div class="li todo '+(t.done?'done':'')+'" style="--pc:'+pc(t.pri)+'">'
   +'<button class="chk '+(t.done?'on':'')+'" title="'+(t.done?'Mark open':'Mark done')+'" aria-label="'+(t.done?'Mark open: ':'Mark done: ')+esc(t.txt)+'" aria-pressed="'+!!t.done+'" onclick="Tasks.tog(\''+t.id+'\')">'+(t.done?'✓':'')+'</button>'
   +'<div class="liB"><b>'+esc(t.txt)+'</b><span><em class="pTag">'+(PRI[t.pri]||PRI[0])[0]+'</em>'+dueTag(t)+'</span></div>'
   +'<div class="tAct"><button class="edt" title="Edit" aria-label="Edit: '+esc(t.txt)+'" onclick="Tasks.edit(\''+t.id+'\')">'+ICO.pen+'</button>'
   +'<button class="del" title="Delete" aria-label="Delete: '+esc(t.txt)+'" onclick="Tasks.del(\''+t.id+'\')">'+ICO.trash+'</button></div></div>';
  const body=grp.filter(g=>g[2].length).map(([l,c,ts])=>'<div class="dHead tGrp '+c+'">'+l+' <em>'+ts.length+'</em></div>'+ts.slice().sort(l==='Done'?(a,b)=>b.ts-a.ts:srt).map(row).join('')).join('');
  v.innerHTML=
  '<form class="card tForm'+(e?' editing':'')+'" onsubmit="return Tasks.add(this)">'
  +'<div class="cHead"><b>'+(e?'Edit task':'Add task')+'</b>'+(e?'<button type="button" class="btn ghost sm" onclick="Tasks.cancel()">✕ cancel</button>':'')+'</div>'
   +'<div class="tTop"><input class="inp tTxt" name="txt" placeholder="What needs doing?" aria-label="Task" autocomplete="off" required value="'+(e?esc(e.txt):'')+'">'
   +'<input class="inp mono tDue" type="date" name="due" value="'+(e?e.due:'')+'" title="Due date (optional)" aria-label="Due date (optional)"></div>'
   +'<div class="tBot"><div class="pSeg" role="radiogroup" aria-label="Priority">'+PRI.map(([l,c],p)=>'<button type="button" role="radio" aria-checked="'+(this.pri===p)+'" class="'+(this.pri===p?'on':'')+'" style="--pc:'+c+'" onclick="Tasks.pri='+p+';Tasks.chip(this)"><i aria-hidden="true"></i>'+l+'</button>').join('')+'</div>'
   +'<button class="btn">'+(e?'Update':'Add task')+'</button></div></form>'
  +'<div class="tBar"><div class="chips">'+[['open',open.length],['all',all.length],['done',done.length]].map(([f,c])=>'<button class="chip '+(this.filter===f?'on':'')+'" onclick="Tasks.filter=\''+f+'\';R(\'tasks\')">'+cap(f)+'<b>'+c+'</b></button>').join('')+'</div>'
  +'<span class="tSum">'+(od?'<span class="od">'+od+' overdue</span> · ':'')+(n?n+' due today':'nothing due today')+'</span></div>'
   +(body||'<div class="empty">'+(this.filter==='done'?'No completed tasks yet.':'Nothing here. Touch grass or grind — your call.')+'</div>')
  +(this.filter!=='open'&&done.length?'<button class="btn ghost sm" onclick="Tasks.clearDone()">Clear completed</button>':'')},
 chip(el){el.parentElement.querySelectorAll('button').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-checked','false')});el.classList.add('on');el.setAttribute('aria-checked','true')},
 add(f){const fd=new FormData(f);const a=DB.get('todos',[]);
  if(this.editId){const t=a.find(x=>x.id===this.editId);
   if(t){t.txt=fd.get('txt').trim();t.due=fd.get('due')||'';t.pri=this.pri}
   DB.set('todos',a);toast('Task updated');this.editId=null;R('tasks');return false}
  a.push({id:uid(),txt:fd.get('txt').trim(),due:fd.get('due')||'',pri:this.pri,done:false,ts:Date.now()});
  DB.set('todos',a);R('tasks');return false},
 edit(id){const t=DB.get('todos',[]).find(x=>x.id===id);if(!t)return;
  this.editId=id;this.pri=t.pri;R('tasks')},
 cancel(){this.editId=null;R('tasks')},
 tog(id){const a=DB.get('todos',[]);const t=a.find(x=>x.id===id);t.done=!t.done;DB.set('todos',a);R('tasks')},
 async del(id){if(!await confirmUI('Remove this task?'))return;
  DB.set('todos',DB.get('todos',[]).filter(t=>t.id!==id));if(this.editId===id)this.editId=null;R('tasks')},
 async clearDone(){if(!await confirmUI('Remove all completed tasks?'))return;
  DB.set('todos',DB.get('todos',[]).filter(t=>!t.done));R('tasks')},
 stats(){const a=DB.get('todos',[]);const due=a.filter(t=>!t.done&&t.due&&t.due<=TODAY()).length;
  return{label:'tasks due',v:due,sub:a.filter(t=>!t.done).length+' open',c:due?'var(--red)':'var(--green)'}},
 quick:{label:'+ Task',fn:"go('tasks')"}};
Module({id:'tasks',name:'Tasks',short:'Tasks',icon:'☑',tab:true,render:v=>Tasks.render(v),stats:()=>Tasks.stats(),quick:Tasks.quick});

/* ═══ EXAMS · midterm/final schedule ═══ */
const Exams={kind:'exam',type:'Midterm',editId:null,view:'list',calDate:null,selDay:null,formOpen:false,
 dt(x){return new Date(x.date+'T'+(x.time||'00:00'))},
 end(x){return new Date(x.date+'T'+(x.time||'23:59'))},
 col(x){return x.kind==='event'?'var(--purple,#b98aff)':x.type==='Final'?'var(--red)':'var(--gold)'},
 badge(x){return '<em class="eBadge" style="--pc:'+this.col(x)+'">'+(x.kind==='event'?'Event':x.type||'Exam')+'</em>'},
 row(x,isPast){const k=dayDiff(x.date),d=new Date(x.date+'T12:00');
  const when=isPast?'':k===0?'Today':k===1?'Tomorrow':'In '+k+'d';
  const urg=k<=2?'var(--red)':k<=7?'var(--gold)':'var(--mut)';
  return '<div class="li eRow'+(isPast?' past':'')+'" style="--pc:'+this.col(x)+'">'
  +'<div class="eDate"><span>'+d.toLocaleDateString('en-GB',{weekday:'short'})+'</span><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('en-GB',{month:'short'})+'</span></div>'
  +'<div class="liB"><b>'+esc(x.subj)+'</b><span>'+this.badge(x)+(x.time?'<i>'+x.time+'</i>':'')+(x.loc?'<i>'+esc(x.loc)+'</i>':'')+(when?'<i class="eWhenM" style="color:'+urg+'">'+when+'</i>':'')+'</span></div>'
  +(when?'<span class="eWhen" style="color:'+urg+'">'+when+'</span>':'')
  +'<div class="tAct"><button class="edt" title="Edit" aria-label="Edit: '+esc(x.subj)+'" onclick="Exams.edit(\''+x.id+'\')">'+ICO.pen+'</button>'
  +'<button class="del" title="Delete" aria-label="Delete: '+esc(x.subj)+'" onclick="Exams.del(\''+x.id+'\')">'+ICO.trash+'</button></div></div>'},
 calMatrix(y,m){const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  return[...Array(42)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d})},
 render(v){const all=DB.get('exams',[]).slice().sort((a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00')));
  const now=new Date();
  const e=this.editId?all.find(x=>x.id===this.editId):null;
  const eKind=e?(e.kind||'exam'):this.kind,eType=e?(e.type||'Midterm'):this.type;
  const showForm=!!e||this.formOpen;
  const seg=(items,cur,fn)=>'<div class="pSeg">'+items.map(([k,l,c])=>'<button type="button" style="--pc:'+c+'" class="'+(cur===k?'on':'')+'" aria-pressed="'+(cur===k)+'" onclick="'+fn(k)+'"><i></i>'+l+'</button>').join('')+'</div>';
  const barHTML='<div class="eBar"><div class="pSeg eView">'+[['list','List'],['cal','Month']].map(([k,l])=>'<button class="'+(this.view===k?'on':'')+'" aria-pressed="'+(this.view===k)+'" onclick="Exams.view=\''+k+'\';R(\'exams\')">'+l+'</button>').join('')+'</div>'
   +(e?'':'<button class="btn '+(showForm?'ghost ':'')+'sm eAddBtn" aria-expanded="'+showForm+'" onclick="Exams.formOpen=!Exams.formOpen;R(\'exams\')">'+(showForm?'Close':'＋ Add exam or event')+'</button>')+'</div>';
  const formHTML=!showForm?'':
   '<form class="card eForm'+(e?' editing':'')+'" onsubmit="return Exams.add(this)">'
   +'<div class="cHead"><b>'+(e?'Edit '+(eKind==='event'?'event':'exam'):'New exam or event')+'</b></div>'
   +'<input class="inp" name="subj" placeholder="What is it? e.g. COMP2119 midterm" required value="'+(e?esc(e.subj):'')+'" aria-label="Title">'
   +'<div class="eSegs">'+seg([['exam','Exam','var(--gold)'],['event','Event','var(--purple,#b98aff)']],eKind,k=>'Exams.setKind(this,\''+k+'\')')
   +'<div id="examTypeRow"'+(eKind==='event'?' hidden':'')+'>'+seg([['Midterm','Midterm','var(--gold)'],['Final','Final','var(--red)']],eType,k=>'Exams.type=\''+k+'\';Exams.chip(this)')+'</div></div>'
   +'<div class="eFields"><label><span>Date</span><input class="inp mono" type="date" name="date" required value="'+(e?e.date:this.selDay&&this.view==='cal'?this.selDay:'')+'"></label>'
   +'<label><span>Time (optional)</span><input class="inp mono" type="time" name="time" value="'+(e?e.time||'':'')+'"></label>'
   +'<label class="eLoc"><span>Room or place (optional)</span><input class="inp" name="loc" value="'+(e?esc(e.loc||''):'')+'"></label></div>'
   +'<div class="eActs">'+(e?'<button type="button" class="btn ghost" onclick="Exams.cancel()">Cancel</button>':'')+'<button class="btn">'+(e?'Save changes':'Add to calendar')+'</button></div></form>';
  let bodyHTML;
  if(this.view==='cal'){
   const anchor=this.calDate?new Date(this.calDate):new Date(now.getFullYear(),now.getMonth(),1);
   const y=anchor.getFullYear(),m=anchor.getMonth();
   const byDate={};all.forEach(x=>{(byDate[x.date]=byDate[x.date]||[]).push(x)});
   const days=this.calMatrix(y,m);
   bodyHTML='<div class="card"><div class="cHead"><button type="button" class="btn ghost sm" aria-label="Previous month" onclick="Exams.shiftMonth(-1)">←</button><b>'+anchor.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</b><button type="button" class="btn ghost sm" aria-label="Next month" onclick="Exams.shiftMonth(1)">→</button></div>'
   +'<div class="calGrid">'+['S','M','T','W','T','F','S'].map(d=>'<div class="calDow">'+d+'</div>').join('')
   +days.map(d=>{const ds=iso(d);const inMonth=d.getMonth()===m,isToday=ds===TODAY(),items=byDate[ds]||[],isSel=this.selDay===ds;
    return '<div class="calCell'+(inMonth?'':' out')+(isToday?' today':'')+(isSel?' sel':'')+(items.length?' has':'')+'" style="'+(items.length?'--dotC:'+this.col(items[0]):'')+'" onclick="Exams.selDay=\''+ds+'\';R(\'exams\')"><span>'+d.getDate()+'</span>'
    +(items.length>1?'<span class="cnt">'+items.length+'</span>':'')
    +(items.length?'<div class="dots">'+items.slice(0,4).map(x=>'<span class="calDot" style="background:'+this.col(x)+'"></span>').join('')+'</div>':'')
    +'</div>'}).join('')
   +'</div></div>'
   +(this.selDay?'<div class="eGrp">'+dayLbl(this.selDay)+'</div>'+((byDate[this.selDay]||[]).map(x=>this.row(x,this.end(x)<now)).join('')||'<div class="empty">Nothing on this day. <button class="agMore" onclick="Exams.formOpen=true;R(\'exams\')">Add something</button></div>'):'')
  }else{
   const upcoming=all.filter(x=>this.end(x)>=now),past=all.filter(x=>this.end(x)<now);
   const soon=upcoming.filter(x=>dayDiff(x.date)<=7),later=upcoming.filter(x=>dayDiff(x.date)>7);
   bodyHTML=(upcoming.length?'':'<div class="empty">Nothing coming up. Use ＋ Add exam or event above.</div>')
   +(soon.length?'<div class="eGrp">Next 7 days <em>'+soon.length+'</em></div>'+soon.map(x=>this.row(x,false)).join(''):'')
   +(later.length?'<div class="eGrp">Later <em>'+later.length+'</em></div>'+later.map(x=>this.row(x,false)).join(''):'')
   +(past.length?'<details class="ePast"><summary>Past <em>'+past.length+'</em></summary>'+past.slice().reverse().map(x=>this.row(x,true)).join('')+'</details>':'')
  }
  v.innerHTML=barHTML+formHTML+bodyHTML},
 chip(el){el.parentElement.querySelectorAll('button').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});el.classList.add('on');el.setAttribute('aria-pressed','true')},
 setKind(el,k){this.kind=k;this.chip(el);
  const row=document.getElementById('examTypeRow');if(row)row.hidden=k==='event'},
 shiftMonth(n){const d=this.calDate?new Date(this.calDate):new Date();d.setDate(1);d.setMonth(d.getMonth()+n);this.calDate=d;R('exams')},
 add(f){const fd=new FormData(f);const a=DB.get('exams',[]);const kind=this.kind||'exam';
  if(this.editId){const x=a.find(y=>y.id===this.editId);
   if(x){x.subj=fd.get('subj').trim();x.kind=kind;x.type=kind==='exam'?this.type:undefined;x.date=fd.get('date');x.time=fd.get('time')||'';x.loc=fd.get('loc').trim()}
   DB.set('exams',a);toast('Saved');this.editId=null;this.formOpen=false;this.kind='exam';this.type='Midterm';R('exams');return false}
  a.push({id:uid(),subj:fd.get('subj').trim(),kind,type:kind==='exam'?this.type:undefined,date:fd.get('date'),time:fd.get('time')||'',loc:fd.get('loc').trim()});
  DB.set('exams',a);toast(kind==='event'?'Event added':'Exam added');this.formOpen=false;R('exams');return false},
 edit(id){const x=DB.get('exams',[]).find(y=>y.id===id);if(!x)return;
  this.editId=id;this.kind=x.kind||'exam';this.type=x.type||'Midterm';R('exams');window.scrollTo({top:0,behavior:'smooth'})},
 cancel(){this.editId=null;this.formOpen=false;this.kind='exam';this.type='Midterm';R('exams')},
 async del(id){if(!await confirmUI('Remove this?'))return;
  DB.set('exams',DB.get('exams',[]).filter(x=>x.id!==id));if(this.editId===id)this.editId=null;R('exams')},
 stats(){const all=DB.get('exams',[]).filter(x=>(x.kind||'exam')==='exam');const now=new Date();
  const next=all.filter(x=>this.end(x)>=now).sort((a,b)=>(a.date+(a.time||'00:00')).localeCompare(b.date+(b.time||'00:00')))[0];
  if(!next)return{label:'next exam',v:'—',sub:'none scheduled',c:'var(--dim)'};
  const dU=dayDiff(next.date);
  return{label:'next exam',v:dU===0?'today':dU===1?'1d':dU+'d',sub:next.subj,c:dU<=2?'var(--red)':dU<=7?'var(--gold)':'var(--green)'}},
 quick:{label:'+ Exam',fn:"go('exams')"}};
Module({id:'exams',name:'Calendar',short:'Cal',icon:'🎓',tab:true,render:v=>Exams.render(v),stats:()=>Exams.stats(),quick:Exams.quick});

/* ═══ LEETCODE · problem bank ═══ */
const LC={diff:'M',status:'Solved',flt:'all',q:'',
 render(v){const a=DB.get('lc',[]).slice().sort((x,y)=>y.d.localeCompare(x.d));
  const cnt=d=>a.filter(p=>p.diff===d).length;
  let list=a;
  if(this.flt==='Review')list=list.filter(p=>p.status==='Review');
  else if(this.flt!=='all')list=list.filter(p=>p.diff===this.flt);
  if(this.q)list=list.filter(p=>(p.title+p.num+p.pattern+p.summary).toLowerCase().includes(this.q.toLowerCase()));
  v.innerHTML=
  '<form class="card" onsubmit="return LC.add(this)"><div class="cHead"><b>Problem bank</b><span class="mono mut">'+a.length+' logged · E'+cnt('E')+' M'+cnt('M')+' H'+cnt('H')+'</span></div>'
  +'<div class="row"><input class="inp mono" name="num" placeholder="#" style="width:70px;margin:0"><input class="inp" name="title" placeholder="Problem title" required style="flex:1;margin:0"><input class="inp" name="url" placeholder="Leetcode url" style="flex:1;margin:0"></div>'
  +'<div class="row"><div class="chips">'+['E','M','H'].map(d=>'<button type="button" class="chip '+(this.diff===d?'on':'')+'" onclick="LC.diff=\''+d+'\';LC.chip(this)">'+d+'</button>').join('')+'</div>'
  +'<input class="inp" name="pattern" placeholder="Pattern (sliding window, dp, graphs…)" style="flex:1;margin:0">'
  +'<div class="chips">'+['Solved','Review','Todo'].map(s=>'<button type="button" class="chip '+(this.status===s?'on':'')+'" onclick="LC.status=\''+s+'\';LC.chip(this)">'+s+'</button>').join('')+'</div></div>'
  +'<textarea class="inp" name="sum" rows="2" placeholder="Summary — approach, complexity, what tripped you"></textarea>'
  +'<button class="btn">Log problem</button></form>'
  +'<div class="row"><div class="chips">'+['all','E','M','H','Review'].map(f=>'<button class="chip '+(this.flt===f?'on':'')+'" onclick="LC.flt=\''+f+'\';R(\'lc\')">'+cap(f)+'</button>').join('')+'</div>'
  +'<form style="display:flex;flex:1;max-width:230px;margin-left:auto" onsubmit="LC.q=this.q.value;R(\'lc\');return false"><input class="inp" name="q" placeholder="Search…" style="margin:0" value="'+esc(this.q)+'"></form></div>'
  +(list.map(p=>{const stC={'Solved':'var(--green)','Review':'var(--red)','Todo':'var(--dim)'}[p.status]||'var(--dim)';
   return '<div class="card li2"><div class="row" style="align-items:center;margin:0"><span class="diff '+p.diff+'">'+p.diff+'</span>'
   +'<div class="liB"><b>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+(p.num?esc(p.num)+'. ':'')+esc(p.title)+'</a>':(p.num?esc(p.num)+'. ':'')+esc(p.title))+'</b>'
   +'<span>'+dayLbl(p.d)+' · '+(esc(p.pattern)||'—')+'</span></div>'
   +'<button class="chip" style="padding:3px 11px;font-size:11px;border-color:'+stC+';color:'+stC+'" title="click to cycle status" onclick="LC.cycle(\''+p.id+'\')">'+p.status+'</button>'
   +'<button class="del" title="Delete" onclick="LC.del(\''+p.id+'\')">'+ICO.trash+'</button></div>'
   +(p.summary?'<details class="sum"><summary>Summary</summary><p>'+esc(p.summary)+'</p></details>':'')+'</div>'}).join('')||'<div class="empty">No problems logged. The OA grind starts here.</div>')},
 chip(el){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')},
 add(f){const fd=new FormData(f);
  const p={id:uid(),d:TODAY(),num:fd.get('num').trim(),title:fd.get('title').trim(),url:fd.get('url').trim(),diff:this.diff,pattern:fd.get('pattern').trim(),status:this.status,summary:fd.get('sum').trim()};
  const a=DB.get('lc',[]);a.push(p);DB.set('lc',a);toast('Logged: '+p.title);R('lc');return false},
 cycle(id){const a=DB.get('lc',[]);const p=a.find(x=>x.id===id);if(!p)return;
  p.status=p.status==='Todo'?'Solved':p.status==='Solved'?'Review':'Todo';
  DB.set('lc',a);R('lc')},
 async del(id){if(!await confirmUI('Remove this problem and its summary?'))return;
  DB.set('lc',DB.get('lc',[]).filter(p=>p.id!==id));R('lc')},
 stats(){const a=DB.get('lc',[]);const wk=a.filter(p=>p.d>=monday()).length;
  return{label:'leetcode',v:a.length,sub:wk+' this wk · '+a.filter(p=>p.status==='Review').length+' to review',c:'var(--cyan)'}},
 quick:{label:'+ LC',fn:"go('lc')"}};
Module({id:'lc',name:'LeetCode',icon:'⌨',render:v=>LC.render(v),stats:()=>LC.stats(),quick:LC.quick});

/* ═══ QUANT PREP · brainteasers · drills · network ═══ */
const Quant={tab:'bt',conf:3,btFlt:'all',btSort:'new',btEdit:null,appStatus:'Applied',
 render(v){v.innerHTML='<div class="tabs">'+[['bt','Brainteasers'],['drill','Mental math'],['app','Applications']].map(([t,l])=>'<button class="chip '+(this.tab===t?'on':'')+'" onclick="Quant.tab=\''+t+'\';R(\'quant\')">'+l+'</button>').join('')+'</div><div id="qB"></div>';
  this['q_'+this.tab]($('#qB'))},
 chip(el){el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on')},
 /* brainteasers */
 btEditing(){return this.btEdit?DB.get('qbt',[]).find(b=>b.id===this.btEdit):null},
 q_bt(el){const all=DB.get('qbt',[]).slice();
  const flt=this.btFlt;
  let a=flt==='all'?all:flt==='easy'?all.filter(b=>b.conf<=2):flt==='med'?all.filter(b=>b.conf===3):all.filter(b=>b.conf>=4);
  a=this.btSort==='hard'?a.slice().sort((x,y)=>y.conf-x.conf||y.ts-x.ts):this.btSort==='easy'?a.slice().sort((x,y)=>x.conf-y.conf||y.ts-x.ts):a.slice().sort((x,y)=>y.ts-x.ts);
  const e=this.btEditing();
  el.innerHTML=
  '<form class="card'+(e?' editing':'')+'" onsubmit="return Quant.addBt(this)"><div class="cHead"><b>'+(e?'Edit brainteaser':'Probability & brainteasers')+'</b>'+(e?'<button type="button" class="btn ghost sm" onclick="Quant.btCancel()">✕ cancel</button>':'<span class="mut">Interview ammo</span>')+'</div>'
  +'<input class="inp" name="q" placeholder="Q — e.g. expected flips for two heads in a row" required value="'+(e?esc(e.q):'')+'">'
  +'<textarea class="inp" name="a" rows="2" placeholder="A — solution sketch">'+(e?esc(e.a):'')+'</textarea>'
  +'<div class="row"><input class="inp" name="src" placeholder="Source (50 Challenging Problems, mock interview…)" style="flex:1;margin:0" value="'+(e?esc(e.src):'')+'">'
  +'<div class="chips">'+[1,2,3,4,5].map(nm=>'<button type="button" class="chip '+(this.conf===nm?'on':'')+'" onclick="Quant.conf='+nm+';Quant.chip(this)">'+nm+'</button>').join('')+'<span class="mut" style="font-size:12px">Difficulty</span></div></div>'
  +'<button class="btn">'+(e?'Update':'Save')+'</button></form>'
  +'<div class="row"><div class="chips">'+[['all','All'],['easy','Easy'],['med','Medium'],['hard','Hard']].map(([f,l])=>'<button class="chip '+(flt===f?'on':'')+'" onclick="Quant.btFlt=\''+f+'\';R(\'quant\')">'+l+' <span class="mut">'+(f==='all'?all.length:f==='easy'?all.filter(b=>b.conf<=2).length:f==='med'?all.filter(b=>b.conf===3).length:all.filter(b=>b.conf>=4).length)+'</span></button>').join('')+'</div>'
  +'<div class="chips">'+[['new','Newest'],['hard','Hardest'],['easy','Easiest']].map(([s,l])=>'<button class="chip '+(this.btSort===s?'on':'')+'" onclick="Quant.btSort=\''+s+'\';R(\'quant\')">'+l+'</button>').join('')+'</div></div>'
  +(a.map(b=>'<div class="card li2'+(b.id===this.btEdit?' editing':'')+'"><div class="row" style="margin:0"><span class="conf c'+b.conf+'">'+b.conf+'/5</span>'
   +'<div class="liB"><b>'+esc(b.q)+'</b><span>'+dayLbl(b.d)+(b.src?' · '+esc(b.src):'')+'</span></div>'
   +'<button class="edt" title="Edit" onclick="Quant.editBt(\''+b.id+'\')">'+ICO.pen+'</button>'
   +'<button class="del" title="Delete" onclick="Quant.delBt(\''+b.id+'\')">'+ICO.trash+'</button></div>'
   +'<details class="sum"><summary>Reveal answer</summary><p>'+(esc(b.a)||'—')+'</p></details></div>').join('')||'<div class="empty">'+(flt==='all'?'Start with: coin flips, dice games, martingales, 100 prisoners…':'Nothing at this difficulty yet.')+'</div>')},
 addBt(f){const fd=new FormData(f);const a=DB.get('qbt',[]);
  if(this.btEdit){const b=a.find(x=>x.id===this.btEdit);
   if(b){b.q=fd.get('q').trim();b.a=fd.get('a').trim();b.src=fd.get('src').trim();b.conf=this.conf}
   DB.set('qbt',a);this.btEdit=null;toast('Brainteaser updated');R('quant');return false}
  a.push({id:uid(),d:TODAY(),ts:Date.now(),q:fd.get('q').trim(),a:fd.get('a').trim(),src:fd.get('src').trim(),conf:this.conf});
  DB.set('qbt',a);R('quant');return false},
 editBt(id){const b=DB.get('qbt',[]).find(x=>x.id===id);if(!b)return;
  this.btEdit=id;this.conf=b.conf;R('quant')},
 btCancel(){this.btEdit=null;R('quant')},
 async delBt(id){if(!await confirmUI('Remove this brainteaser?'))return;
  DB.set('qbt',DB.get('qbt',[]).filter(b=>b.id!==id));R('quant')},
 /* mental math */
 q_drill(el){const a=DB.get('qdrill',[]).slice().sort((x,y)=>y.d.localeCompare(x.d)||y.ts-x.ts);
  const best=a.length?Math.max(...a.map(d=>+d.score)):0;
  el.innerHTML=
  '<form class="card row" onsubmit="return Quant.addDrill(this)">'
  +'<input class="inp mono" type="number" name="score" placeholder="Score" required style="width:110px;margin:0">'
  +'<input class="inp" name="tool" placeholder="Tool (Zetamac, GMAT club…)" style="flex:1;margin:0">'
  +'<button class="btn">Log drill</button></form>'
  +'<div class="card"><div class="cHead"><b>Daily arithmetic</b><span class="mono mut">best '+(best||'—')+'</span></div>'
  +'<div class="bars">'+(a.slice(0,14).reverse().map(d=>'<div class="bcol"><i style="height:'+Math.max(6,Math.min(100,(+d.score)/(best||1)*100))+'%;background:var(--cyan)" title="'+dayLbl(d.d)+' · '+esc(d.score)+' pts'+(d.tool?' · '+esc(d.tool):'')+'"></i><span>'+d.d.slice(8)+'</span></div>').join('')||'<span class="mut" style="font-size:12.5px">Log a daily mental-math score — compounding applies.</span>')+'</div></div>'
  +a.slice(0,10).map(d=>'<div class="li"><div class="liB"><b class="mono">'+esc(d.score)+'</b><span>'+dayLbl(d.d)+(d.tool?' · '+esc(d.tool):'')+'</span></div><button class="del" title="Delete" onclick="Quant.delDrill(\''+d.id+'\')">'+ICO.trash+'</button></div>').join('')},
 addDrill(f){const fd=new FormData(f);
  const a=DB.get('qdrill',[]);a.push({id:uid(),d:TODAY(),ts:Date.now(),score:fd.get('score'),tool:fd.get('tool').trim()});
  DB.set('qdrill',a);toast('Drill logged');R('quant');return false},
 async delDrill(id){if(!await confirmUI('Remove this drill entry?'))return;
  DB.set('qdrill',DB.get('qdrill',[]).filter(d=>d.id!==id));R('quant')},
 /* applications */
 appStC:{Applied:'var(--dim)',OA:'var(--cyan)',Interview:'var(--gold)',Offer:'var(--green)',Rejected:'var(--red)'},
 appRow(x){const stC=this.appStC[x.status]||'var(--dim)';
  const late=x.deadline&&x.deadline<=TODAY()&&x.status!=='Offer'&&x.status!=='Rejected';
  return '<div class="li '+(late?'late':'')+'"><div class="liB"><b>'+esc(x.firm)+' <span class="mut">'+esc(x.role)+'</span></b>'
  +'<span>'+(x.applied?'applied '+dayLbl(x.applied):'—')+(x.deadline?' · <em class="'+(late?'warn':'')+'" style="font-style:normal">next '+dayLbl(x.deadline)+'</em>':'')+(x.notes?' · '+esc(x.notes):'')+'</span></div>'
  +'<select class="inp mono" style="width:auto;margin:0;border-color:'+stC+';color:'+stC+'" onchange="Quant.setStatus(\''+x.id+'\',this.value)">'+['Applied','OA','Interview','Offer','Rejected'].map(s=>'<option value="'+s+'"'+(x.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'
  +'<button class="del" title="Delete" onclick="Quant.delApp(\''+x.id+'\')">'+ICO.trash+'</button></div>'},
 q_app(el){const all=DB.get('qapp',[]).slice().sort((x,y)=>(x.deadline||'9').localeCompare(y.deadline||'9'));
  const due=all.filter(x=>x.deadline&&x.deadline<=TODAY()&&x.status!=='Offer'&&x.status!=='Rejected');
  this.appFlt=this.appFlt||'all';
  const flt=this.appFlt;
  const a=flt==='all'?all:flt==='Active'?all.filter(x=>x.status==='Applied'||x.status==='OA'||x.status==='Interview'):all.filter(x=>x.status===flt);
  const active=all.filter(x=>x.status==='Applied'||x.status==='OA'||x.status==='Interview');
  const offers=all.filter(x=>x.status==='Offer');
  const rejected=all.filter(x=>x.status==='Rejected');
  el.innerHTML=
  '<form class="card" onsubmit="return Quant.addApp(this)"><div class="cHead"><b>Applications</b>'+(due.length?'<span class="mut mono">'+due.length+' deadline'+(due.length>1?'s':'')+' due</span>':'')+'</div>'
  +'<div class="row"><input class="inp" name="firm" placeholder="Firm" required style="flex:1;margin:0"><input class="inp" name="role" placeholder="Role" style="flex:1;margin:0"></div>'
  +'<div class="chips">'+['Applied','OA','Interview','Offer','Rejected'].map(s=>'<button type="button" class="chip '+(this.appStatus===s?'on':'')+'" onclick="Quant.appStatus=\''+s+'\';Quant.chip(this)">'+s+'</button>').join('')+'</div>'
  +'<div class="row" style="margin-top:10px"><label class="lbl">Applied<input class="inp mono" type="date" name="applied"></label><label class="lbl">Next deadline<input class="inp mono" type="date" name="deadline"></label></div>'
  +'<input class="inp" name="notes" placeholder="Notes / link"><button class="btn">Save</button></form>'
  +'<div class="row"><div class="chips">'+[['all','All'],['Active','Active'],['Offer','Offers'],['Rejected','Rejected']].map(([f,l])=>'<button class="chip '+(flt===f?'on':'')+'" onclick="Quant.appFlt=\''+f+'\';R(\'quant\')">'+l+' <span class="mut">'+(f==='all'?all.length:f==='Active'?active.length:f==='Offer'?offers.length:rejected.length)+'</span></button>').join('')+'</div></div>'
  +(all.length===0?'<div class="empty">Log every firm you apply to — track the pipeline.</div>'
   :flt!=='all'?(a.map(x=>this.appRow(x)).join('')||'<div class="empty">Nothing here yet.</div>')
   :(active.length?'<div class="dHead">Active pipeline · '+active.length+'</div>'+active.map(x=>this.appRow(x)).join(''):'')
    +(offers.length?'<div class="dHead">Offers · '+offers.length+'</div>'+offers.map(x=>this.appRow(x)).join(''):'')
    +(rejected.length?'<div class="dHead">Rejected · '+rejected.length+'</div>'+rejected.map(x=>this.appRow(x)).join(''):''))},
 addApp(f){const fd=new FormData(f);
  const a=DB.get('qapp',[]);a.push({id:uid(),firm:fd.get('firm').trim(),role:fd.get('role').trim(),status:this.appStatus,applied:fd.get('applied'),deadline:fd.get('deadline'),notes:fd.get('notes').trim()});
  DB.set('qapp',a);R('quant');return false},
 setStatus(id,status){const a=DB.get('qapp',[]);const x=a.find(y=>y.id===id);if(!x)return;
  x.status=status;DB.set('qapp',a);R('quant')},
 async delApp(id){if(!await confirmUI('Remove this application?'))return;
  DB.set('qapp',DB.get('qapp',[]).filter(x=>x.id!==id));R('quant')},
 stats(){const bt=DB.get('qbt',[]);
  const due=DB.get('qapp',[]).filter(x=>x.deadline&&x.deadline<=TODAY()&&x.status!=='Offer'&&x.status!=='Rejected').length;
  return[{label:'brainteasers',v:bt.length,sub:bt.filter(b=>b.conf>=4).length+' hard',c:'var(--gold)'},
         {label:'deadlines',v:due,sub:due?'act now':'pipeline clear',c:due?'var(--red)':'var(--green)'}]},
 quick:{label:'+ Quant',fn:"go('quant')"}};
Module({id:'quant',name:'Quant prep',icon:'∑',render:v=>Quant.render(v),stats:()=>Quant.stats(),quick:Quant.quick});
</script>
