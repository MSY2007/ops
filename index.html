<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>OPS — personal console</title>
<meta name="theme-color" content="#0c141f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPS">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
 --bg:#0c141f;--panel:#121d2b;--panel2:#182636;--line:#22354b;--line2:#31506f;
 --tx:#e9f1f8;--mut:#8aa1b8;--dim:#5c7288;
 --amber:#ffb454;--green:#3ddc97;--red:#ff6161;--cyan:#59c8e6;--gold:#ffd166;
 --accent:var(--amber);--accentInk:#161014;
 --disp:'Space Grotesk',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
button,.chip,.msPad button,.msQuick button{touch-action:manipulation}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(900px 520px at 88% -8%,rgba(255,180,84,.075),transparent 62%),
 radial-gradient(820px 620px at -8% 108%,rgba(61,220,151,.055),transparent 62%),var(--bg)}
.bg::before{content:"";position:absolute;inset:0;background-image:
 linear-gradient(rgba(122,162,196,.05) 1px,transparent 1px),
 linear-gradient(90deg,rgba(122,162,196,.05) 1px,transparent 1px);background-size:34px 34px}
.bg::after{content:"";position:absolute;width:60vw;height:60vw;left:20%;top:-20%;border-radius:50%;
 background:radial-gradient(circle,rgba(89,200,230,.05),transparent 65%);animation:drift 26s ease-in-out infinite alternate}
.bg2{position:fixed;inset:0;z-index:-1;width:46vw;height:46vw;right:-10%;bottom:-14%;left:auto;top:auto;border-radius:50%;
 background:radial-gradient(circle,rgba(255,180,84,.045),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-12%,18%) scale(1.15)}}
@keyframes drift2{to{transform:translate(14%,-16%) scale(1.2)}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
@keyframes breathe{0%,100%{box-shadow:0 4px 16px rgba(255,180,84,.28)}50%{box-shadow:0 4px 26px rgba(255,180,84,.55)}}
.logo{animation:breathe 4s ease-in-out infinite}
/* layout */
#side{position:fixed;left:0;top:0;bottom:0;width:218px;display:flex;flex-direction:column;padding:18px 12px 14px;border-right:1px solid var(--line);background:rgba(12,20,31,.82)}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 16px}
.logo{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(140deg,var(--amber),#d97f1e);color:#191006;border-radius:9px;font-weight:700;font-size:17px;box-shadow:0 4px 16px rgba(255,180,84,.28)}
.brand b{font:700 17px var(--disp);letter-spacing:.06em;display:block}
.brand i{font:400 10.5px var(--mono);color:var(--dim);font-style:normal;letter-spacing:.14em;text-transform:uppercase}
#sideNav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mut);cursor:pointer;border-left:2px solid transparent;font-size:14px;transition:.15s;user-select:none}
.nv span{width:20px;text-align:center;color:var(--mc,inherit)}
.nv:hover{color:var(--tx);background:var(--panel)}
.nv.on{color:var(--tx);background:var(--panel2);border-left-color:var(--accent)}
.sideFoot{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
#vaultDot{background:none;border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:8px;cursor:pointer;transition:.15s}
#vaultDot:hover{color:var(--amber);border-color:var(--amber)}
#stUsage{font:400 10.5px var(--mono);color:var(--dim)}
#main{margin-left:218px;min-height:100vh}
#topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 26px;background:rgba(12,20,31,.78);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#crumb{font:700 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#clock{font:600 13px var(--mono);color:var(--amber)}
#view{max-width:940px;margin:0 auto;padding:22px 26px 110px;animation:popIn .25s ease}
@keyframes popIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* mobile */
#tabbar{display:none}
@media(max-width:899px){
 #side{display:none}#main{margin:0}#view{padding:16px 14px 120px}#topbar{padding:10px 14px}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,21,32,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;gap:0;scrollbar-width:none;-ms-overflow-style:none}
 #tabbar::-webkit-scrollbar{display:none}
 .tb{flex-shrink:0;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:var(--dim);font:500 9.5px var(--body);padding:4px 0;cursor:pointer;transition:color .15s}
 .tb span{font-size:17px;color:var(--mc,inherit)}.tb i{font-style:normal;white-space:nowrap}.tb.on{color:var(--accent)}.tb.on span{color:var(--accent)}
}
/* components */
h1{font:700 clamp(27px,6vw,42px)/1.05 var(--disp);letter-spacing:-.01em}
h1 span{color:var(--amber)}
.kick{font:600 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.sub{color:var(--mut);font-size:13px;margin-top:8px}
.hero{padding:10px 0 20px}
.qadd{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.card{background:linear-gradient(180deg,var(--panel),#101a27);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;transition:transform .18s,border-color .18s}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--line2)}}
.cHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cHead b{font:700 16px var(--disp);letter-spacing:.01em}
.streak{display:flex;gap:16px;align-items:center;margin-top:14px;padding:15px 18px;background:linear-gradient(180deg,var(--panel),#101a27);border:1px solid var(--line);border-radius:var(--r)}
.streak .flameBadge{flex-shrink:0;width:50px;height:50px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.streak .flameBadge svg{width:26px;height:26px}
.streak .flameBadge path{fill:var(--dim);transition:.2s}
.streak.lit .flameBadge{background:linear-gradient(160deg,#3a2410,#1c1206);border-color:#5a3a14;animation:breathe 2.8s ease-in-out infinite}
.streak.lit .flameBadge path{fill:url(#flameGrad)}
.streak .sMain{flex:1;min-width:0}
.streak .sCount{display:flex;align-items:baseline;gap:7px}
.streak .sCount b{font:800 27px var(--disp);color:var(--tx);letter-spacing:-.01em}
.streak .sCount span{font:600 12.5px var(--body);color:var(--mut)}
.weekPips{display:flex;align-items:center;gap:6px;margin-top:9px}
.sHint{font:500 11.5px var(--body);color:var(--dim);margin-top:7px}
.pip{box-sizing:border-box;flex-shrink:0;width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 9px var(--mono);color:var(--dim);background:var(--panel2);border:1px solid var(--line)}
.pip.on{background:linear-gradient(160deg,var(--amber),#c77b1f);color:#1c1206;border-color:transparent}
.pip.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--accent)}
.yearTag{flex-shrink:0;align-self:flex-start;font:600 11px var(--mono);color:var(--dim);white-space:nowrap}
.yearTag b{color:var(--mut);font-weight:600}
.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:2px solid var(--c,var(--cyan));position:relative}
.stat i{display:block;font:500 12px var(--body);color:var(--mut);font-style:normal;margin-bottom:7px}
.stat i::first-letter{text-transform:uppercase}
.stat b{font:600 25px/1 var(--mono);color:var(--c,var(--cyan))}
.stat u{display:block;text-decoration:none;color:var(--dim);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.big{grid-column:span 2;padding:16px 18px}
.stat.big b{font-size:34px}
.stat .spark{display:block;width:100%;height:26px;margin-top:6px}
.stat.cta{display:flex;flex-direction:column;justify-content:center;cursor:pointer;border-top-color:var(--line2);background:var(--panel2);transition:border-color .15s,transform .15s}
.stat.cta:hover{border-top-color:var(--c,var(--cyan));transform:translateY(-1px)}
.stat.cta i{margin-bottom:8px}
.stat.cta b{font:600 13.5px var(--body);color:var(--tx);line-height:1.3}
/* home */
.qadd.home{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:-4px -2px 16px;padding:4px 2px}
.qadd.home::-webkit-scrollbar{display:none}
.qadd.home .btn{flex-shrink:0;white-space:nowrap;border-radius:99px;padding:8px 14px;font-size:13px}
button.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;min-width:0;transition:border-color .15s,transform .15s}
button.stat:hover{border-color:var(--line2);transform:translateY(-1px)}
button.stat:focus-visible,.agRow button:focus-visible,button.agRow:focus-visible,.agMore:focus-visible,.qadd.home .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.statGrid.home{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;margin-bottom:14px}
.statGrid.home .stat b{font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statGrid.home .stat.big b{font-size:32px}
.statGrid.home .stat.cta b{font:600 13.5px var(--body);white-space:normal}
.agenda{border-left:3px solid var(--gold);padding-bottom:10px}
.agenda .cHead{margin-bottom:6px}
.agenda .cHead b{font-size:19px}
.agSub{font:600 12px var(--body);color:var(--dim);margin:10px 0 4px}
.agRow{display:flex;align-items:center;gap:12px;width:100%;padding:9px 2px;border:none;border-top:1px solid var(--line);background:none;color:var(--tx);font:inherit;text-align:left}
.agSub+.agRow{border-top:none}
button.agRow{cursor:pointer;border-radius:0}
button.agRow:hover .agTxt{color:var(--accent)}
.agRow .chk{box-shadow:inset 0 0 0 2px var(--pc);border:none;width:24px;height:24px}
.agRow .chk:hover{background:color-mix(in srgb,var(--pc) 25%,transparent)}
.agTxt{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.agTxt em{display:block;font:400 12px var(--body);color:var(--mut);font-style:normal;margin-top:2px}
.agWhen{flex-shrink:0;font:500 12px var(--mono);color:var(--mut)}
.agWhen.od{color:var(--red);font-weight:600}.agWhen.td{color:var(--amber);font-weight:600}
.agDate{flex-shrink:0;width:38px;text-align:center;font:500 10.5px var(--body);color:var(--mut);line-height:1.1;border-left:3px solid var(--pc);padding-left:2px}
.agDate b{display:block;font:700 18px var(--disp);color:var(--tx)}
.agMore{background:none;border:none;color:var(--cyan);font:500 13px var(--body);cursor:pointer;padding:8px 2px}
.agClear{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:14px;padding:4px 0 6px}
.homeDuo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.homeDuo .streak{margin:0}
.homeDuo .card{margin:0}
.homeDuo .bars{height:84px}
@media(max-width:899px){.statGrid.home{grid-template-columns:repeat(2,minmax(0,1fr))}.homeDuo{grid-template-columns:minmax(0,1fr)}}
.bars{height:112px;display:flex;gap:7px;align-items:flex-end}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bcol i{width:100%;max-width:36px;border-radius:5px 5px 2px 2px;transform-origin:bottom;animation:grow .55s ease both}
@keyframes grow{from{transform:scaleY(0)}}
.bcol span{font:400 10px var(--mono);color:var(--dim)}
.meter{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 8px}
.meter i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--green);vertical-align:middle;margin-left:4px}
.phB{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tset{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;align-items:center;margin-bottom:6px}
.tset.h{font-size:11.5px;color:var(--dim,#7d8ea3);margin:8px 0 4px;line-height:1.25}
.tset .inp{margin:0;width:100%;min-width:0;text-align:center}
.tset .n{text-align:center;color:var(--dim,#7d8ea3)}
.tgt{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.tgt span{font-size:12.5px;padding:3px 9px;border-radius:8px;background:var(--panel2)}
.tgt b{color:var(--green);font-weight:600}
.how{font-size:12.5px;line-height:1.5;margin:0 0 10px}
.how summary{cursor:pointer;color:var(--green)}
.slot{display:inline-flex;align-items:center;gap:2px;margin:0 6px 6px 0}
.chip{border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:99px;padding:6px 13px;font:500 12.5px var(--body);cursor:pointer;transition:.15s}
.chip:hover{color:var(--tx);border-color:var(--mut)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accentInk);font-weight:600}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.calDow{text-align:center;font-size:11px;color:var(--mut);padding:4px 0}
.calCell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--panel2,rgba(255,255,255,.03));border:1px solid var(--line);border-top:3px solid var(--line);font-size:12px;padding:5px;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.calCell:hover{border-color:var(--mut)}
.calCell.out{opacity:.35}
.calCell.today{border-color:var(--accent);font-weight:600}
.calCell.sel{background:var(--accent);color:var(--accentInk)}
.calCell.has{background:color-mix(in srgb,var(--dotC,var(--accent)) 14%,var(--panel2,rgba(255,255,255,.03)));border-top-color:var(--dotC,var(--accent))}
.calCell.sel.has{background:var(--accent)}
.calCell .cnt{position:absolute;top:3px;right:5px;font-size:10px;font-weight:700;color:var(--dotC,var(--accent))}
.calCell.sel .cnt{color:var(--accentInk)}
.calCell .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.calDot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.btn{background:var(--accent);color:var(--accentInk);border:none;border-radius:10px;padding:10px 18px;font:600 13.5px var(--body);cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,97,97,.4)}
.btn.danger:hover{background:rgba(255,97,97,.12);filter:none}
.inp{width:100%;background:#0d1725;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px 12px;font:400 14px var(--body);margin-bottom:10px;transition:border-color .15s}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,84,.13)}
textarea.inp{resize:vertical}
.mini{width:64px;background:transparent;border:none;border-bottom:1px solid var(--line2);color:var(--amber);font:600 13px var(--mono);text-align:center}
.mini:focus{outline:none;border-color:var(--amber)}
@media (max-width:768px){.inp,.mini,select,button{font-size:16px}}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.lbl{display:block;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.lbl .inp{margin-top:5px}
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.dHead{font:600 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 2px 8px}
.li{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;animation:popIn .25s ease both}
.li.top{align-items:flex-start}
.liB{flex:1;min-width:0}
.liB b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.liB span{font-size:12px;color:var(--mut)}
.liN{font:600 15px var(--mono);white-space:nowrap}
.x{background:none;border:none;color:var(--dim);font-size:14px;cursor:pointer;padding:6px;border-radius:8px;transition:.15s;flex-shrink:0}
.x:hover{color:var(--red);background:rgba(255,97,97,.1)}
.x.corner{position:absolute;top:8px;right:8px}
.th{width:46px;height:46px;object-fit:cover;border-radius:9px;cursor:zoom-in;flex-shrink:0;border:1px solid var(--line2)}
.th.prev{width:88px;height:88px}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--dim);font-size:13px;margin-bottom:14px}
.mono{font-family:var(--mono)}.mut{color:var(--mut)}.dim{color:var(--dim)}
.big{font-size:24px}
a{color:var(--cyan)}
.warn{color:var(--red);font-style:normal;font-weight:600}
/* mood */
.moodRow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mood{flex:1;min-width:64px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;text-align:center;transition:.15s}
.mood span{font-size:26px;display:block;transition:transform .2s}
.mood i{font:500 10px var(--mono);color:var(--dim);font-style:normal;letter-spacing:.05em}
.mood:hover{border-color:var(--line2)}.mood:hover span{transform:scale(1.15)}
.mood.on{border-color:var(--amber);background:rgba(255,180,84,.1)}
.mood.on span{transform:scale(1.25)}
/* training */
.tips{display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--cyan);padding-left:12px;margin:10px 0}
.tips i{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--cyan);font-style:normal}
.tips span{font-size:13px;color:var(--tx);display:flex;align-items:center;gap:6px}
.tipBox{width:100%}
.setRow .inp{width:96px;margin:0}
.ex{position:relative}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pic{cursor:pointer;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--panel);transition:.15s}
.pic img{width:100%;height:150px;object-fit:cover;display:block}
.pic figcaption{font-size:10.5px;color:var(--mut);padding:6px 8px}
.pic.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,180,84,.2)}
.cmpBar{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;margin-bottom:12px;font:500 12px var(--mono);color:var(--amber)}

<script>
'use strict';
/* ── utils ── */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>String(s??'').replace(/\b\w/g,c=>c.toUpperCase());

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const dayLbl=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const now=()=>new Date().toTimeString().slice(0,5);
/* ── storage ── */
const DB={
 get(k,f){try{const v=localStorage.getItem('hk.'+k);return v==null?f:JSON.parse(v)}catch(e){return f}},
 set(k,v){try{localStorage.setItem('hk.'+k,JSON.stringify(v));return true}
  catch(e){toast('⚠ Storage full — export a backup, then clear old photos','err');return false}},
 del(k){localStorage.removeItem('hk.'+k)},
 all(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('hk.'))o[k]=localStorage.getItem(k)}return o}
};
/* ── cloud sync (Supabase — every module below, one generic table; RLS scopes every row to auth.uid())
   ARRAY_BUCKETS hold lists of {id,...} records, synced item-by-item.
   SINGLE_BUCKETS (cfg, vault) are one object each, synced as a single row.
   'cur' (in-progress workout draft) is intentionally excluded — per-device scratch state. ── */
const SB_URL='https://luvbcbvigplqtqahbhcv.supabase.co';
const SB_KEY='sb_publishable_gk4vE0d2pOYoygEGCMGjCw_CkedkzlF';
const ARRAY_BUCKETS=['meas','meals','moods','notes','wos','ex','pics','routines','todos','lc','qbt','qdrill','qapp','pt','ph','exp','recur','nw','audit','exams'];
const SINGLE_BUCKETS=['cfg','vault'];
const Cloud={
 client:null,user:null,syncing:false,knownIds:{},
 tick(){try{return JSON.parse(localStorage.getItem('hk.__synctick')||'{}')}catch(e){return{}}},
 setTick(t){localStorage.setItem('hk.__synctick',JSON.stringify(t))},
 init(){if(!window.supabase)return;
  this.client=window.supabase.createClient(SB_URL,SB_KEY);
  this.client.auth.getSession().then(({data})=>{this.user=data.session?data.session.user:null;if(this.user)this.pullAll();this.refresh()});
  this.client.auth.onAuthStateChange((_e,session)=>{this.user=session?session.user:null;if(this.user)this.pullAll();this.refresh()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&this.user)this.pullAll()});
  window.addEventListener('focus',()=>{if(this.user)this.pullAll()});
  setInterval(()=>{if(this.user)this.pullAll()},30000)},
 refresh(){if(CUR!=='train'&&CUR!=='set')return;
  const ae=document.activeElement;
  if(ae&&$('#view').contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  R(CUR)},
 async signUp(email,pw){if(!this.client)return;const{error}=await this.client.auth.signUp({email,password:pw,options:{emailRedirectTo:'https://msy2007.github.io/ops/'}});
  if(error){toast(error.message,'err');return}
  toast('Account created — check your email to confirm, then sign in')},
 async signIn(email,pw){if(!this.client)return;const{error}=await this.client.auth.signInWithPassword({email,password:pw});
  if(error){toast(error.message,'err');return}
  toast('Signed in ✓ syncing everything…')},
 async signOut(){if(!this.client)return;await this.client.auth.signOut();toast('Signed out — data stays on this device')},
 /* called by the DB.set hook below on every write to a synced bucket */
 onLocalWrite(key,val){
  if(!this.user)return;
  if(ARRAY_BUCKETS.includes(key))this.syncArray(key,val);
  else if(SINGLE_BUCKETS.includes(key))this.syncSingle(key,val);
 },
 async syncArray(bucket,arr){
  const ids=new Set(arr.map(x=>x.id));
  const t=this.tick();
  if(arr.length){
   const rows=arr.map(x=>({bucket,id:x.id,user_id:this.user.id,data:x,ts:Date.now()}));
   const{error}=await this.client.from('records').upsert(rows);
   if(error){toast('Sync failed ('+bucket+'): '+error.message,'err');return}
   arr.forEach(x=>t[bucket+'.'+x.id]=Date.now());
  }
  const prev=this.knownIds[bucket]||new Set();
  for(const id of prev)if(!ids.has(id)){
   await this.client.from('records').delete().eq('bucket',bucket).eq('id',id).eq('user_id',this.user.id);
   delete t[bucket+'.'+id];
  }
  this.knownIds[bucket]=ids;this.setTick(t)},
 async syncSingle(bucket,val){
  const{error}=await this.client.from('records').upsert({bucket,id:bucket,user_id:this.user.id,data:val,ts:Date.now()});
  if(error){toast('Sync failed ('+bucket+'): '+error.message,'err');return}
  const t=this.tick();t[bucket]=Date.now();this.setTick(t)},
 async pullAll(){if(!this.user||this.syncing)return;this.syncing=true;
  try{const{data,error}=await this.client.from('records').select('*').eq('user_id',this.user.id);
   if(error){toast('Sync pull failed: '+error.message,'err');return}
   const t=this.tick();
   const byBucket={};(data||[]).forEach(r=>{(byBucket[r.bucket]=byBucket[r.bucket]||[]).push(r)});
   for(const bucket of ARRAY_BUCKETS){
    const rows=byBucket[bucket]||[];
    const local=DB.get(bucket,[]);const byId={};local.forEach(x=>byId[x.id]=x);
    const remoteIds=new Set();
    rows.forEach(r=>{remoteIds.add(r.id);const shadow=t[bucket+'.'+r.id]||0;
     if(!byId[r.id]||r.ts>=shadow){byId[r.id]=r.data;t[bucket+'.'+r.id]=r.ts}});
    this.knownIds[bucket]=new Set(Object.keys(byId));
    DB.set(bucket,Object.values(byId));
    const toPush=local.filter(x=>!remoteIds.has(x.id));
    if(toPush.length){const rowsUp=toPush.map(x=>({bucket,id:x.id,user_id:this.user.id,data:x,ts:Date.now()}));
     await this.client.from('records').upsert(rowsUp);
     toPush.forEach(x=>t[bucket+'.'+x.id]=Date.now())}}
   for(const bucket of SINGLE_BUCKETS){
    const rows=byBucket[bucket]||[];const r=rows[0];
    const shadow=t[bucket]||0;
    if(r&&r.ts>=shadow){DB.set(bucket,r.data);t[bucket]=r.ts}
    else if(!r){const local=DB.get(bucket,null);if(local)await this.syncSingle(bucket,local)}}
   this.setTick(t);this.refresh()}
  finally{this.syncing=false}},
 cardHTML(){if(!window.supabase)return '<div class="card li2"><span class="mut" style="font-size:12.5px">⚠ Cloud library failed to load — offline only.</span></div>';
  if(this.user)return '<div class="card li2"><div class="row" style="margin:0;align-items:center;justify-content:space-between">'
   +'<span class="mono" style="font-size:12.5px">☁ syncing everything as '+esc(this.user.email)+'</span>'
   +'<div class="row" style="margin:0"><button class="btn ghost sm" onclick="Cloud.pullAll()">Sync now</button><button class="btn ghost sm" onclick="Cloud.signOut()">Sign out</button></div></div></div>';
  return '<div class="card"><div class="cHead"><b>Cloud sync</b><span class="mut">Sign in to sync all data across devices</span></div>'
   +'<div class="row" style="flex-wrap:wrap;gap:8px"><input class="inp" id="cbEmail" type="email" placeholder="Email" style="flex:1;min-width:160px;margin:0">'
   +'<input class="inp" id="cbPw" type="password" placeholder="Password" style="flex:1;min-width:140px;margin:0"></div>'
   +'<div class="row" style="margin-top:8px"><button class="btn sm" onclick="Cloud.signIn($(\'#cbEmail\').value.trim(),$(\'#cbPw\').value)">Sign in</button>'
   +'<button class="btn ghost sm" onclick="Cloud.signUp($(\'#cbEmail\').value.trim(),$(\'#cbPw\').value)">Create account</button></div></div>'}
};

(function(){const _set=DB.set.bind(DB);
 DB.set=(k,v)=>{const ok=_set(k,v);if(ok)Cloud.onLocalWrite(k,v);return ok}})();

function toast(m,t){const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),2400);setTimeout(()=>d.remove(),2850)}
const LB={show(src){$('#lb img').src=src;$('#lb').classList.add('on')}};
function thumb(src,cls){return '<img class="th '+(cls||'')+'" src="'+src+'" onclick="LB.show(this.src)" alt="">'}
/* ── image compressor ── */
const Img={pick(cb,max,q){max=max||1100;q=q||.78;
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
 inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));
   const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};
  r.readAsDataURL(f)};
 inp.click()}};

const Mods={},ORDER=[];

/* inline onclick handlers resolve bare open() to document.open(), so they call go() */
function go(id){open(id)}
function open(id,soft){const m=Mods[id];if(!m)return;CUR=id;
 document.documentElement.style.setProperty('--accent',MOD_COLOR[id]||'var(--amber)');
 $$('.nv').forEach(n=>n.classList.toggle('on',n.dataset.id===id));

  +'<p class="mono" style="color:var(--red);font-size:12.5px;overflow-wrap:anywhere">'+esc(String(err&&err.message||err))+'</p>'
  +'<p class="mut" style="font-size:12px">Copy this line and send it over — the rest of the app still works.</p>'
  +'<button class="btn ghost" onclick="go(\'today\')">← Back to Home</button></div>';}
 if(!soft){window.scrollTo({top:0});closeSheet()}}
const R=id=>{if(CUR===id)open(id,true)};
/* nav order: pinned pages first, the rest in registration order */
const NAV_FIRST=['today','money','tasks','exams','mood'];
const navList=()=>ORDER.filter(id=>!Mods[id].hidden).sort((a,b)=>(NAV_FIRST.indexOf(a)+1||99)-(NAV_FIRST.indexOf(b)+1||99));

 const norm=list.filter(id=>Mods[id].kind!=='foot'),foot=list.filter(id=>Mods[id].kind==='foot');

  return '<div class="nv '+(id===CUR?'on':'')+'" data-id="'+id+'" style="--mc:'+(MOD_COLOR[id]||'inherit')+'"><span>'+m.icon+'</span>'+m.name+'</div>'}).join('');
 const tabs=norm.filter(id=>m_tab(id)).slice(0,5);
 $('#tabbar').innerHTML=tabs.map(id=>{const m=Mods[id];
  return '<button class="tb '+(id===CUR?'on':'')+'" data-id="'+id+'" style="--mc:'+(MOD_COLOR[id]||'inherit')+'"><span>'+m.icon+'</span><i>'+(m.short||m.name)+'</i></button>'}).join('')
  +'<button class="tb" data-act="more"><span>☰</span><i>More</i></button>';
 $('#sheetGrid').innerHTML=list.map(id=>{const m=Mods[id];
  return '<button class="sg" data-id="'+id+'"><span>'+m.icon+'</span>'+m.name+'</button>'}).join('')
  +'<button class="sg dimsg" data-act="vault"><span>◈</span>Archive</button>'}
function m_tab(id){return Mods[id].tab}
function openSheet(){$('#sheet').classList.add('on')}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-id],[data-act]');
 if(!t)return;
 if(t.dataset.id&&Mods[t.dataset.id])open(t.dataset.id);
 else if(t.dataset.act==='more')openSheet();
 else if(t.dataset.act==='vault'){closeSheet();VaultOpen()}

function VaultOpen(){if(Mods.vault)open('vault');else toast('Vault arrives in Phase 6','err')}
addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='V'||e.key==='v')){e.preventDefault();VaultOpen()}});
/* ── number ticker ── */
function tick(el,val){const s=String(val);if(s.startsWith('+')||isNaN(parseFloat(s))){el.textContent=val;return}
 const num=parseFloat(s),dec=(s.split('.')[1]||'').length,t0=performance.now();
 (function f(t){const p=Math.min(1,(t-t0)/500);el.textContent=(num*(1-Math.pow(1-p,3))).toFixed(dec);if(p<1)requestAnimationFrame(f)})(t0)}
function logDaySet(){const days=new Set();['meals','moods','notes','wos'].forEach(k=>DB.get(k,[]).forEach(x=>x.d&&days.add(x.d)));return days}
function streakN(days){days=days||logDaySet();
 let s=0,d=new Date();if(!days.has(iso(d)))d.setDate(d.getDate()-1);
 while(days.has(iso(d))){s++;d.setDate(d.getDate()-1)}
 return s}

  return '<div class="agRow" style="--pc:'+(PC[t.pri]||PC[0])+'"><button class="chk" aria-label="Mark done: '+esc(t.txt)+'" title="Mark done" onclick="Tasks.tog(\''+t.id+'\');R(\'today\');toast(\'Done ✓\')"></button>'

  return '<button class="agRow ev" style="--pc:'+c+'" onclick="go(\'exams\')"><span class="agDate"><b>'+d.getDate()+'</b>'+d.toLocaleDateString('en-GB',{weekday:'short'})+'</span>'
  +'<span class="agTxt">'+esc(x.subj)+'<em>'+(x.kind==='event'?'Event':x.type)+(x.time?', '+x.time:'')+(x.loc?', '+esc(x.loc):'')+'</em></span><span class="agWhen'+(k===0?' td':'')+'">'+whenLbl(k)+'</span></button>'};
 const n=tasks.length+evs.length;
 return '<section class="card agenda"><div class="cHead"><b>On your plate</b><span class="mut">'+(n?n+' item'+(n>1?'s':''):'')+'</span></div>'

Module({id:'today',name:'Home',short:'Home',icon:'▦',tab:true,kind:'core',render(v){
 const d=new Date(),hr=d.getHours();
 const greet=hr<5?'Late shift':hr<12?'Morning':hr<18?'Afternoon':'Evening';
 const doy=Math.ceil((d-new Date(d.getFullYear(),0,0))/864e5);
 const stats=ORDER.flatMap(id=>{const s=Mods[id].stats&&Mods[id].stats();return s?[].concat(s).map(x=>Object.assign({mod:id},x)):[]});
 const quick=ORDER.map(id=>Mods[id].quick).filter(Boolean);
 const meals=DB.get('meals',[]),days=[...Array(7)].map((_,i)=>daysAgo(6-i));
 const kcal=days.map(dd=>meals.filter(m=>m.d===dd).reduce((s,m)=>s+(+m.kcal||0),0));
 const hasMods=ORDER.some(id=>Mods[id].kind!=='core');

 const nw=DB.get('nw',[]),exp=DB.get('exp',[]),moods=DB.get('moods',[]);
 const spendSpark=days.map(dd=>exp.filter(x=>x.d===dd&&x.type!=='profit').reduce((s,x)=>s+(+x.amt||0),0));
 const moodSpark=moods.slice(-8).map(x=>+x.score||0);
 const SPARK={'net worth':nw.length>1?sparkline(nw.slice(-10).map(x=>x.amt),'var(--amber)'):'',
  'spend · wk':spendSpark.some(Boolean)?sparkline(spendSpark,'var(--amber)'):'',
  'mood':moodSpark.length>1?sparkline(moodSpark,'var(--cyan)'):''};
 v.innerHTML=
   '<div class="hero"><div class="kick">'+greet+' · week '+Math.ceil(doy/7)+'</div>'
  +'<h1>'+d.toLocaleDateString('en-GB',{weekday:'long'})+'<span> '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'})+' '+d.getFullYear()+'</span></h1></div>'
  +(quick.length?'<div class="qadd home">'+quick.map(q=>'<button class="btn ghost sm" onclick="'+q.fn+'">'+esc(q.label.replace(/^[+＋]\s*/,'+ '))+'</button>').join('')+'</div>':'')
  +agendaHTML()

    const big=BIG_STATS.includes(s.label)?' big':'',name=STAT_NAME[s.label]||s.label;

    const val=STAT_MONEY.includes(s.label)&&typeof s.v==='number'?fmt(s.v):s.v;
    return '<button class="stat'+big+'" style="--c:'+(s.c||'var(--cyan)')+'" onclick="go(\''+s.mod+'\')" aria-label="'+esc(name)+': '+esc(val)+'. Open '+esc(Mods[s.mod].name)+'"><i>'+name+'</i><b data-t="'+esc(val)+'">'+esc(val)+'</b>'+(SPARK[s.label]||'')+'<u>'+esc(s.sub||'')+'</u></button>'
   }).join('')+'</div>'
  +'<div class="homeDuo">'
  +'<div class="streak'+(sN?' lit':'')+'"><div class="flameBadge">'+FLAME_SVG+'</div>'
  +'<div class="sMain"><div class="sCount"><b>'+sN+'</b><span>day streak</span></div>'
  +'<div class="weekPips">'+weekPips+'</div>'
  +(sN?'':'<div class="sHint">Log a meal, mood, note or workout to start</div>')+'</div>'
  +'<div class="yearTag">day <b>'+doy+'</b>/365</div></div>'

  +'<div class="bars">'+days.map((dd,i)=>'<div class="bcol"><i style="height:'+Math.max(4,Math.min(100,kcal[i]/30))+'%;background:'+(kcal[i]?'linear-gradient(180deg,var(--amber),#c77b1f)':'var(--line)')+'" title="'+kcal[i]+' kcal"></i><span>'+'SMTWTFS'[new Date(dd+'T12:00').getDay()]+'</span></div>').join('')+'</div></div>'

 $$('#view .stat b[data-t]').forEach(b=>tick(b,b.dataset.t))

function exportAll(){const blob=new Blob([JSON.stringify(DB.all(),null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ops-backup-'+TODAY()+'.json';a.click();
 const c=DB.get('cfg',{});c.lastExport=Date.now();DB.set('cfg',c);
 toast('Backup downloaded ✓');R('today')}
function importAll(){const i=document.createElement('input');i.type='file';i.accept='.json';
 i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;
   for(const k in o)if(k.startsWith('hk.')){try{DB.set(k.slice(3),JSON.parse(o[k]))}catch(e){localStorage.setItem(k,o[k])}n++}
   toast('Imported '+n+' keys — reloading');setTimeout(()=>location.reload(),700)}
  catch(err){toast('Bad file','err')}};r.readAsText(f)};i.click()}
function wipeAll(){
 if(!confirm('Erase ALL OPS data on this device?'))return;
 if(prompt('Type ERASE to permanently delete everything:')!=='ERASE'){toast('Wipe cancelled — nothing deleted');return}
 const a=DB.all();for(const k in a)localStorage.removeItem(k);location.reload()}

  +'<div class="row" style="margin:0 0 10px;gap:12px;flex-wrap:wrap"><div class="chips"><button type="button" class="chip '+(this.online?'on':'')+'" onclick="Poker.setMode(true)">🌐 Online</button><button type="button" class="chip '+(!this.online?'on':'')+'" onclick="Poker.setMode(false)">🏟 Live</button></div>'
  +'<div class="chips">'+(this.online?this.ONLINE:this.LIVE).map(t=>'<button type="button" class="chip '+(this.tag===t?'on':'')+'" onclick="Poker.tag=\''+t+'\';R(\'poker\')">'+t+'</button>').join('')+'</div></div>'
  +'<div class="row"><input class="inp" name="name" placeholder="Event (e.g. $110 GGM, Macau live)" required style="flex:1;margin:0"><input class="inp mono" type="date" name="d" value="'+TODAY()+'" style="margin:0"></div>'
  +'<div class="row"><input class="inp mono" type="number" min="0" step="0.01" name="buyin" placeholder="Buy-in" required style="flex:1;margin:0"><input class="inp mono" type="number" min="0" step="0.01" name="cash" placeholder="Cash-out (0 = bust)" required style="flex:1;margin:0"><input class="inp mono" name="place" placeholder="Place e.g. 12/120" style="flex:1;margin:0"></div>'
  +'<input class="inp" name="note" placeholder="Notes (ICM spot? tilt? deep run?)">'
  +'<button class="btn">Save</button></form>'
  +'<div class="card" style="padding:12px 14px"><div class="row" style="margin:0;flex-wrap:wrap;gap:8px"><div class="chips">'+['all',...tags].map(t=>'<button class="chip '+(this.ftag===t?'on':'')+'" onclick="Poker.ftag=\''+t+'\';R(\'poker\')">'+(t==='all'?'All tags':t)+'</button>').join('')+'</div>'
  +'<select class="inp mono" style="width:150px;margin:0;margin-left:auto" onchange="Poker.fbi=+this.value;R(\'poker\')"><option value="0">All buy-ins</option><option value="-1" '+(this.fbi===-1?'selected':'')+'>Freeroll</option><option value="250" '+(this.fbi===250?'selected':'')+'>≤ 250</option><option value="1500" '+(this.fbi===1500?'selected':'')+'>≤ 1.5k</option><option value="5000" '+(this.fbi===5000?'selected':'')+'>≤ 5k</option></select></div></div>'
  +'<div class="dHead">History'+(filtered?' <span class="mut">· filtered</span>':'')+'</div>'
  +(list.map(t=>{const p=+t.cash-+t.buyin;
   return '<div class="li"><div class="liB"><b>'+esc(t.name)+' <span class="ntag" style="font-size:9px;padding:1px 7px">'+esc(t.tag||'—')+'</span></b><span>'+dayLbl(t.d)+' · in '+pk(t.buyin)+' · '+(t.place||'—')+(t.note?' · '+esc(t.note):'')+'</span></div>'
   +'<span class="mono liN" style="color:'+(p>=0?'var(--green)':'var(--red)')+'">'+(p>=0?'+':'−')+Math.abs(p).toLocaleString('en-US')+'</span>'
   +'<button class="del" title="Delete" onclick="Poker.delT(\''+t.id+'\')">'+ICO.trash+'</button></div>'}).join('')||'<div class="empty">'+((filtered?'No tournaments match the filter':'No tournaments yet')+'. Log every buy-in — variance needs a sample size.')+'</div>')},
 addT(f){const fd=new FormData(f);
  const arr=this.ts();
  arr.push({id:uid(),d:fd.get('d')||TODAY(),name:fd.get('name').trim(),buyin:+fd.get('buyin')||0,cash:+fd.get('cash')||0,place:fd.get('place').trim(),note:fd.get('note').trim(),online:this.online,tag:this.tag});
  DB.set('pt',arr);toast('Tournament logged');R('poker');return false},
 async delT(id){if(!await confirmUI('Remove this tournament result?'))return;
  DB.set('pt',this.ts().filter(t=>t.id!==id));R('poker')},
 p_hands(el){const a=this.hs().slice().sort((x,y)=>y.ts-x.ts);
  const q=this.hq.toLowerCase();
  const list=q?a.filter(h=>(h.title+h.body+h.tags).toLowerCase().includes(q)):a;
  el.innerHTML=
  '<form class="card" onsubmit="return Poker.addH(this)"><div class="cHead"><b>Hand database</b><span class="mut">review > volume</span></div>'
  +'<div class="row"><input class="inp" name="title" placeholder="Title (e.g. AK 3bet pot vs reg)" required style="flex:1;margin:0"><input class="inp" name="tags" placeholder="Tags (3bet, ICM, bluff…)" style="flex:1;margin:0"></div>'
  +'<textarea class="inp mono" name="body" rows="4" placeholder="Street-by-street: 6max · 100bb · hero BTN AhKh · UTG opens 2.5bb…"></textarea>'
  +'<button class="btn">Save hand</button></form>'
  +'<form class="row" onsubmit="Poker.hq=this.q.value;R(\'poker\');return false"><input class="inp" name="q" placeholder="Search hands…" style="flex:1;margin:0" value="'+esc(this.hq)+'"><button class="btn ghost">Search</button>'+(this.hq?'<button type="button" class="btn ghost sm" onclick="Poker.hq=\'\';R(\'poker\')">Clear</button>':'')+'</form>'
  +(list.map(h=>'<div class="card li2"><div class="row" style="margin:0"><div class="liB"><b>'+esc(h.title)+'</b><span>'+dayLbl(h.d)+' · '+(esc(h.tags)||'—')+'</span></div><button class="del" title="Delete" onclick="Poker.delH(\''+h.id+'\')">'+ICO.trash+'</button></div>'
   +'<details class="sum"><summary>Read hand</summary><p style="font-family:var(--mono);font-size:12.5px">'+esc(h.body)+'</p></details></div>').join('')||'<div class="empty">Save the hands that made you think.</div>')},
 addH(f){const fd=new FormData(f);
  const arr=this.hs();
  arr.push({id:uid(),d:TODAY(),ts:Date.now(),title:fd.get('title').trim(),tags:fd.get('tags').trim(),body:fd.get('body').trim()});
  DB.set('ph',arr);toast('Hand saved');R('poker');return false},
 async delH(id){if(!await confirmUI('Remove this hand?'))return;
  DB.set('ph',this.hs().filter(h=>h.id!==id));R('poker')},
 stats(){const m=TODAY().slice(0,7);
  /* P/L comes from Money only (tournament cashes are logged there): Poker-category profit minus expense */
  const me=DB.get('exp',[]).filter(x=>x.cat==='poker'&&x.d.startsWith(m));
  const pl=me.reduce((s,x)=>s-sAmt(x),0);
  const sub=me.length?me.length+' Money entr'+(me.length===1?'y':'ies'):'nothing logged this month';
  return{label:'poker · month',mod:'money',v:(pl>0?'+':pl<0?'−':'')+'$'+Math.round(Math.abs(pl)).toLocaleString('en-US'),sub,c:pl>=0?'var(--green)':'var(--red)'}},
 quick:{label:'+ Poker',fn:"go('poker')"}};
Module({id:'poker',name:'Poker',icon:'♠',render:v=>Poker.render(v),stats:()=>Poker.stats(),quick:Poker.quick});
</script>
<script>
/* ═══ VAULT · AES-GCM, PIN-derived key ═══ */
const b64={
 e:u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s)},
 d:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const Vault={unlocked:false,data:null,key:null,salt:null,buf:'',mode:'unlock',tmpPin:'',tmp:null,vtab:'pw',timer:null,
 async derive(pin,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
 async enc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return{iv:b64.e(iv),ct:b64.e(ct)}},
 async dec(key,rec){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64.d(rec.iv)},key,b64.d(rec.ct));
  return JSON.parse(new TextDecoder().decode(pt))},
 async pullMerge(){if(!Cloud.user||!Cloud.client||!this.unlocked)return;
  try{const{data,error}=await Cloud.client.from('records').select('*').eq('user_id',Cloud.user.id).eq('bucket','vault');
   if(error||!data||!data.length)return;
   const rec=data[0].data;if(!rec||!rec.salt||b64.e(this.salt)!==rec.salt)return;
   const remote=await this.dec(this.key,rec);
   const merge=(loc,rem)=>{loc=loc||[];const ids=new Set(loc.map(x=>x.id));const out=loc.slice();
    (rem||[]).forEach(x=>{if(!ids.has(x.id))out.push(x)});return out};
   this.data.pw=merge(this.data.pw,remote.pw);
   this.data.imgs=merge(this.data.imgs,remote.imgs);
   this.data.notes=merge(this.data.notes,remote.notes)}
  catch(e){/* offline or undecryptable remote — best-effort merge, skip */}},
 async save(){if(!this.unlocked)return;
  await this.pullMerge();
  const r=await this.enc(this.key,this.data);
  DB.set('vault',{...DB.get('vault',{}),...r})},
 /* ── screens ── */
 render(v){if(!(window.crypto&&window.crypto.subtle)){
   v.innerHTML='<div class="card" style="border-color:var(--red)"><b>WebCrypto unavailable</b><p class="mut" style="margin-top:6px">This browser context can\u2019t run the encrypted vault.</p></div>';return}
  const rec=DB.get('vault',null);
  if(!rec){this.mode='create1';this.buf='';
   v.innerHTML=this.padHTML('Create a vault PIN','4\u20136 digits \u00b7 encrypted on-device \u00b7 no recovery if forgotten')}
  else if(!this.unlocked){this.mode='unlock';this.buf='';
   v.innerHTML=this.padHTML('Locked','enter PIN to open the vault')
   +'<p style="text-align:center;margin-top:22px"><button class="mut" style="background:none;border:none;font-size:11px;cursor:pointer;text-decoration:underline" onclick="Vault.forget()">forget PIN \u00b7 erase vault</button></p>'}
  else{this.arm();v.innerHTML=this.inner()}
  if($('#pinDots'))this.dots()},
 padHTML(t,sub){return '<div class="pinWrap"><div class="kick">'+t+'</div>'
  +'<div class="dots" id="pinDots"></div><div class="pinMsg" id="pinMsg">'+sub+'</div>'
  +'<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button onclick="Vault.digit(\''+n+'\')">'+n+'</button>').join('')
  +'<button onclick="Vault.ok()" style="font-size:14px">OK</button><button onclick="Vault.digit(\'0\')">0</button><button onclick="Vault.back()">\u232b</button></div></div>'},
 dots(){const d=$('#pinDots');if(d)d.innerHTML=[...Array(6)].map((_,i)=>'<span class="dot '+(i<this.buf.length?'f':'')+'"></span>').join('')},
 msg(t){const m=$('#pinMsg');if(m)m.textContent=t},
 digit(x){if(this.buf.length<6){this.buf+=x;this.dots()}},
 back(){this.buf=this.buf.slice(0,-1);this.dots()},
 async ok(){if(this.buf.length<4){this.msg('at least 4 digits');return}
  if(this.mode==='create1'){this.tmpPin=this.buf;this.buf='';this.mode='create2';this.dots();this.msg('repeat it to confirm');return}
  if(this.mode==='create2'){
   if(this.buf!==this.tmpPin){this.mode='create1';this.tmpPin='';this.buf='';this.dots();this.msg('mismatch \u2014 start over');return}
   try{this.salt=crypto.getRandomValues(new Uint8Array(16));
    this.key=await this.derive(this.buf,this.salt);
    this.data={pw:[],imgs:[],notes:[]};
    const r=await this.enc(this.key,this.data);
    DB.set('vault',{salt:b64.e(this.salt),iv:r.iv,ct:r.ct});
    this.unlocked=true;this.buf='';this.arm();toast('Vault created');R('vault')}
   catch(e){this.msg('encryption error \u2014 see console');console.error(e)}return}
  try{if(Cloud.user)await Cloud.pullAll();
   const rec=DB.get('vault',null);
   this.key=await this.derive(this.buf,b64.d(rec.salt));
   this.data=await this.dec(this.key,rec);
   this.data.pw=this.data.pw||[];this.data.imgs=this.data.imgs||[];this.data.notes=this.data.notes||[];
   this.unlocked=true;this.buf='';this.arm();R('vault')}
  catch(e){this.buf='';this.dots();this.msg('wrong PIN');
   const d=$('#pinDots');if(d){d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),450)}}},
 /* ── locking ── */
 arm(){clearTimeout(this.timer);this.timer=setTimeout(()=>Vault.lock(false),120000)},
 lock(silent){if(!this.unlocked)return;
  this.unlocked=false;this.data=null;this.key=null;clearTimeout(this.timer);
  if(!silent)toast('Vault locked');
  if(CUR==='vault')R('vault')},
 async forget(){if(!await confirmUI('This permanently deletes EVERYTHING in the vault.'))return;
  DB.del('vault');
  if(Cloud.user&&Cloud.client)await Cloud.client.from('records').delete().eq('bucket','vault').eq('user_id',Cloud.user.id);
  R('vault')},
 /* ── unlocked UI ── */
 inner(){const d=this.data;
  return '<div class="row" style="justify-content:space-between"><div class="tabs" style="margin:0">'+[['pw','Passwords'],['imgs','Images'],['notes','Notes']].map(([t,l])=>'<button class="chip '+(this.vtab===t?'on':'')+'" onclick="Vault.vtab=\''+t+'\';Vault.arm();R(\'vault\')">'+l+'</button>').join('')+'</div>'
  +'<button class="btn ghost sm" onclick="Vault.lock(false)">\ud83d\udd12 Lock</button></div>'
  +(this.vtab==='pw'?this.vPw(d):this.vtab==='imgs'?this.vImgs(d):this.vNotes(d))},
 vPw(d){return '<form class="card" onsubmit="return Vault.addPw(this)"><div class="cHead"><b>New credential</b></div>'
  +'<div class="row"><input class="inp" name="site" placeholder="Site / service" required style="flex:1;margin:0"><input class="inp" name="user" placeholder="Username / email" style="flex:1;margin:0"></div>'
  +'<input class="inp mono" name="pass" placeholder="Password" required>'
  +'<input class="inp" name="note" placeholder="Note (security question, 2FA backup\u2026)">'
  +'<button class="btn">Save</button></form>'
  +d.pw.map(p=>'<div class="li"><div class="liB"><b>'+esc(p.site)+'</b><span class="mono">'+esc(p.user)+(p.note?' \u00b7 '+esc(p.note):'')+'</span></div>'
   +'<span class="mono masked">'+(p.show?esc(p.pass):'\u2022\u2022\u2022\u2022\u2022\u2022')+'</span>'
   +'<button class="btn ghost sm" onclick="Vault.togPw(\''+p.id+'\')">'+(p.show?'hide':'show')+'</button>'
   +'<button class="btn ghost sm" onclick="Vault.copy(\''+p.id+'\')">Copy</button>'
   +'<button class="del" title="Delete" onclick="Vault.delPw(\''+p.id+'\')">'+ICO.trash+'</button></div>').join('')
  +'<details class="sum card"><summary>Vault settings</summary>'
  +'<form class="row" style="margin-top:12px" onsubmit="Vault.repin(this);return false">'
  +'<input class="inp mono" type="password" name="p1" placeholder="New PIN" required style="width:130px;margin:0">'
  +'<input class="inp mono" type="password" name="p2" placeholder="Repeat" required style="width:130px;margin:0">'
  +'<button class="btn ghost sm">Change PIN</button></form>'
  +'<p class="mut" style="font-size:11.5px;margin-top:8px">Auto-locks after 2 min idle or on tab switch. Forgotten PIN = unrecoverable.</p></details>'
  +(d.pw.length?'':'<div class="empty">Nothing stored yet.</div>')},
 addPw(f){const fd=new FormData(f);
  this.data.pw.push({id:uid(),site:fd.get('site').trim(),user:fd.get('user').trim(),pass:fd.get('pass'),note:fd.get('note').trim()});
  this.save();R('vault');return false},
 togPw(id){const p=this.data.pw.find(x=>x.id===id);if(!p)return;p.show=!p.show;this.save();R('vault')},
 copy(id){const p=this.data.pw.find(x=>x.id===id);if(!p)return;
  const done=()=>toast('Password copied \u2014 clear your clipboard after');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p.pass).then(done,()=>this.copyFb(p.pass,done));
  else this.copyFb(p.pass,done)},
 copyFb(t,cb){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb()}catch(e){toast('Copy failed','err')}ta.remove()},
 async delPw(id){if(!await confirmUI('Delete this credential?'))return;
  this.data.pw=this.data.pw.filter(p=>p.id!==id);this.save();R('vault')},
 async repin(f){const p1=f.p1.value,p2=f.p2.value;
  if(p1.length<4||p1!==p2){toast('PINs must match, 4+ digits','err');return}
  this.salt=crypto.getRandomValues(new Uint8Array(16));
  this.key=await this.derive(p1,this.salt);
  const r=await this.enc(this.key,this.data);
  DB.set('vault',{salt:b64.e(this.salt),iv:r.iv,ct:r.ct});
  toast('PIN changed');this.arm();R('vault')},
 vImgs(d){return '<form class="card row" onsubmit="return Vault.addImg(this)">'
  +'<span id="vPicBtn">'+this.picBtn()+'</span>'
  +'<input class="inp" name="cap" placeholder="Caption" style="flex:1;margin:0"><button class="btn">Save</button></form>'
  +'<div class="pgrid">'+(d.imgs.slice().reverse().map(p=>'<figure class="pic" style="cursor:default"><img src="'+p.ph+'" onclick="LB.show(this.src)" alt=""><figcaption class="mono">'+p.d+(p.cap?' \u00b7 '+esc(p.cap):'')+'<button class="x" style="float:right" onclick="Vault.delImg(\''+p.id+'\')">\u2715</button></figcaption></figure>').join('')||'<div class="empty" style="grid-column:1/-1">Encrypted at rest with your PIN.</div>')+'</div>'},
 picBtn(){return '<button type="button" class="btn ghost" onclick="Img.pick(u=>Vault.pic(u),900,.7)">\ud83d\udcf7 '+(this.tmp?'\u2713 image ready':'Add sensitive image')+'</button>'},
 pic(u){this.tmp=u;const w=$('#vPicBtn');if(w)w.innerHTML=this.picBtn()},
 addImg(f){if(!this.tmp){toast('Pick an image first','err');return false}
  this.data.imgs.push({id:uid(),d:TODAY(),ph:this.tmp,cap:new FormData(f).get('cap').trim()});
  this.tmp=null;this.save();R('vault');return false},
 async delImg(id){if(!await confirmUI('Delete this image?'))return;
  this.data.imgs=this.data.imgs.filter(p=>p.id!==id);this.save();R('vault')},
 vNotes(d){return '<form class="card" onsubmit="return Vault.addNote(this)">'
  +'<textarea class="inp" name="txt" rows="3" placeholder="Anything too sensitive for the regular journal\u2026" required></textarea>'
  +'<button class="btn">Save note</button></form>'
  +(d.notes.slice().reverse().map(n=>'<div class="li top"><div class="liB"><b style="white-space:pre-wrap">'+esc(n.txt)+'</b><span>'+dayLbl(n.d)+' \u00b7 '+n.t+'</span></div><button class="del" title="Delete" onclick="Vault.delNote(\''+n.id+'\')">'+ICO.trash+'</button></div>').join('')||'<div class="empty">No secure notes.</div>')},
 addNote(f){this.data.notes.push({id:uid(),d:TODAY(),t:now(),txt:new FormData(f).get('txt').trim()});
  this.save();R('vault');return false},
 async delNote(id){if(!await confirmUI('Delete this note?'))return;
  this.data.notes=this.data.notes.filter(n=>n.id!==id);this.save();R('vault')}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)Vault.lock(true)});
Module({id:'vault',name:'Vault',icon:'\ud83d\udd12',hidden:true,render:v=>Vault.render(v)});
</script>

  +p.lifts.map(L=>{const st=(p.style||{})[L.id]||{};
    return '<details class="card"><summary style="cursor:pointer"><b>'+esc(L.name)+'</b> <span class="mut" style="font-size:12px">— style sheet</span></summary><div style="margin-top:10px">'
    +this.STYLE.map(([k,lb,ph])=>'<label class="lbl">'+lb+'</label><input class="inp" placeholder="'+esc(ph)+'" value="'+esc(st[k]||'')+'" onchange="Train.stv(\''+L.id+'\',\''+k+'\',this.value)">').join('')+'</div></details>'}).join('')},
 coverHTML(p){const ph=this.curPh(),inf=this.info(),g={};
  const add=(k,n)=>{g[k]=(g[k]||0)+n};
  p.split.forEach(day=>day.forEach(sl=>add(this.LGRP[sl.l]||'Other',this.rx(ph,sl.r).sets)));
  (p.acc||[]).forEach((day,d)=>day.forEach(a=>{if((a.ex||[]).filter(Boolean).length&&(p.split[d]||[]).length)add(a.g||'Other',this.ACRX[ph].s)}));
  const ks=Object.keys(g).sort((a,b)=>g[b]-g[a]);
  return '<div class="dHead">Sets per muscle group · '+esc(p.ph[ph].n)+' week</div><div class="card"><div class="chips">'+ks.map(k=>'<span class="chip on" style="cursor:default">'+esc(k)+' <b>'+g[k]+'</b></span>').join('')+'</div><div class="mut" style="font-size:12px;margin-top:8px">Rough guide: 8–12 hard sets a week per muscle grows it. Squats count as Legs, and bench also hits shoulders and triceps indirectly. Anything at 0 or under 6 needs a slot.</div></div>'},
 accv(d,j,k,v){const p=this.prog();const a=p.acc[d][j];if(!a)return;a[k]=k==='ex'?v.split(',').map(x=>x.trim()).filter(Boolean):v.trim();this.save(p);R('train')},
 rmAcc(d,j){const p=this.prog();p.acc[d].splice(j,1);this.save(p);R('train')},
 addAcc(d){const p=this.prog();p.acc[d].push({g:'New group',ex:['Exercise name']});this.save(p);R('train')},
 setStart(v){if(!v||isNaN(new Date(v+'T12:00'))){toast('Pick a date','err');return}
  const d=new Date(v+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
  const p=this.prog();p.start=iso(d);this.save(p);this.wkOv=null;toast('Cycle starts Mon '+dayLbl(p.start));R('train')},
 lf(i,k,v){const p=this.prog();const L=p.lifts[i];if(!L)return;
  if(k==='inc')v=+v||0;if(k==='bw')v=!!v;L[k]=v;this.save(p);R('train')},
 cycRole(d,j){const p=this.prog();const s=p.split[d][j];s.r={P:'S',S:'T',T:'P'}[s.r];this.save(p);R('train')},
 mvSlot(d,j){const p=this.prog();const a=p.split[d];[a[j-1],a[j]]=[a[j],a[j-1]];this.save(p);R('train')},
 rmSlot(d,j){const p=this.prog();p.split[d].splice(j,1);this.save(p);R('train')},
 addSlot(d,l){if(!l)return;const p=this.prog();const a=p.split[d];a.push({l,r:a.length?'S':'P'});this.save(p);R('train')},
 phv(i,k,v){const p=this.prog();if(k==='sets')v=Math.max(1,+v||3);if(k==='rpe')v=Math.min(10,Math.max(1,+v||8));p.ph[i][k]=v;this.save(p);R('train')},
 stv(id,k,v){const p=this.prog();p.style=p.style||{};(p.style[id]=p.style[id]||{})[k]=v.trim();this.save(p)},
 /* ── LIFTS (same-phase progression across cycles) ── */
 topSet(sets){let b=null;sets.forEach(s=>{const w=+s.w||0,r=+s.r||0;if(!b||w>b.w||(w===b.w&&r>b.r))b={w,r,rpe:s.rpe}});return b},
 t_lifts(el){const p=this.prog(),wos=this.wos();
  el.innerHTML=p.lifts.map(L=>{const e=this.exs().find(x=>x.name===L.name);
   const rows=p.ph.map((P,pi)=>{const by={};
    wos.forEach(w=>{if(w.ph!==pi)return;this.wExs(w).forEach(it=>{if(it.ex!==L.name||!it.sets.length)return;
     const t=this.topSet(it.sets);const c=w.cyc||0;if(!by[c]||t.w>by[c].w||(t.w===by[c].w&&t.r>by[c].r))by[c]=t})});
    const cs=Object.keys(by).map(Number).sort((a,b)=>a-b).slice(-4);
    if(!cs.length)return '<div class="mono mut" style="font-size:12px;margin-top:4px">W'+(pi+1)+' '+esc(P.n)+' — no data yet</div>';
    const f=t=>(t.w>0?t.w:'BW')+'×'+t.r+(t.rpe?'@'+t.rpe:'');
    let d='';if(cs.length>1){const a=by[cs[cs.length-2]],b=by[cs[cs.length-1]];const dw=b.w-a.w,dr=b.r-a.r;
     d=dw||dr?' <span style="color:'+((dw>0||(dw===0&&dr>0))?'var(--green)':'var(--red)')+'">'+(dw?(dw>0?'▲ +':'▼ ')+dw+' kg':(dr>0?'▲ +':'▼ ')+dr+' reps')+'</span>':' <span class="mut">flat</span>'}
    return '<div class="mono" style="font-size:12px;margin-top:4px"><span class="mut">W'+(pi+1)+' '+esc(P.n)+'</span> — '+cs.map(c=>'C'+(c||'?')+' '+f(by[c])).join(' → ')+d+'</div>'}).join('');
   return '<div class="card"><div class="cHead"><b>'+esc(L.name)+'</b><span class="mono mut">'+(this.best(L.name)?'e1RM '+this.best(L.name)+' kg':'no logs yet')+(e&&(e.best||e.last)?' · ref best '+esc(e.best||'—')+' / last '+esc(e.last||'—'):'')+'</span></div>'+rows+'</div>'}).join('')
  +'<div class="empty" style="margin-top:8px">Each row compares the same phase across cycles (top set per cycle). Overshot RPE means hold the weight next time.</div>'},
 /* ── LIBRARY ── */
 t_library(el){let exs=this.sortedExs();
  if(this.lsort==='best')exs.sort((a,b)=>this.best(b.name)-this.best(a.name));
  const off=this.cuesOff();
  el.innerHTML=
  '<div class="row" style="justify-content:space-between;gap:12px"><form class="row" style="margin:0;flex:1" onsubmit="return Train.addEx(this)"><input class="inp" name="n" placeholder="Add exercise to library…" required style="flex:1;margin:0"><button class="btn">Add</button></form>'
  +'<div class="chips"><button class="chip '+(this.lsort==='az'?'on':'')+'" onclick="Train.lsort=\'az\';R(\'train\')">A–Z</button><button class="chip '+(this.lsort==='best'?'on':'')+'" onclick="Train.lsort=\'best\';R(\'train\')">e1RM</button>'
  +'<button class="chip '+(off?'on':'')+'" onclick="Train.toggleCues()">'+(off?'cues hidden':'cues shown')+'</button></div></div>'
  +(exs.length?exs.map(e=>this.exCard(e)).join(''):'<div class="empty">Library empty — add your lifts and build the cue sheet.</div>')},
 exCard(e){const best=this.best(e.name);
  if(this.renId===e.id)return '<div class="card ex editing"><form class="row" style="margin:0" onsubmit="return Train.doRen(this,\''+e.id+'\')"><input class="inp" name="n" value="'+esc(e.name)+'" required style="flex:1;margin:0"><button class="btn sm">Rename</button><button type="button" class="btn ghost sm" onclick="Train.renId=null;R(\'train\')">Cancel</button></form></div>';
  const off=this.cuesOff();
  const shown=e.tips.filter(t=>!t.hid),hidden=e.tips.filter(t=>t.hid);
  return '<div class="card ex"><div class="cHead"><b>'+esc(e.name)+'</b>'+(best?'<span class="mono" style="color:var(--green)">e1RM '+best+' kg</span>':'')+'</div>'
  +'<div class="row setRow" style="margin:0 0 8px;align-items:center"><span class="lbl" style="margin:0">Best</span><input class="inp mono" placeholder="e.g. 100×5" value="'+esc(e.best||'')+'" onchange="Train.setRef(\''+e.id+'\',\'best\',this.value)" style="width:110px"><span class="lbl" style="margin:0">Last</span><input class="inp mono" placeholder="e.g. 95×8" value="'+esc(e.last||'')+'" onchange="Train.setRef(\''+e.id+'\',\'last\',this.value)" style="width:110px"></div>'
  +(off?'':'<div class="tips">'
   +shown.map(t=>'<span>• '+esc(t.x)+'<button class="x" title="Hide cue" onclick="Train.hidTip(\''+e.id+'\',\''+t.id+'\',true)">'+ICO.eyeOff+'</button><button class="x" onclick="Train.delTip(\''+e.id+'\',\''+t.id+'\')">✕</button></span>').join('')
   +hidden.map(t=>'<span style="opacity:.45">• '+esc(t.x)+' <em class="dim" style="font-style:normal;font-size:11px">(hidden)</em><button class="x" title="Show cue" onclick="Train.hidTip(\''+e.id+'\',\''+t.id+'\',false)">'+ICO.eye+'</button></span>').join('')
   +((e.tips.length===0)?'<span class="mut" style="font-size:12.5px">No cues yet — add your first form note below.</span>':'')
   +'</div>'
   +'<form class="row" style="margin:0" onsubmit="return Train.addTip(this,\''+e.id+'\')"><input class="inp" name="t" placeholder="+ form cue" required style="flex:1;margin:0" value="'+esc(this.tipDraft[e.id]||'')+'" oninput="Train.tipDraft[\''+e.id+'\']=this.value"><button class="btn ghost sm">Add cue</button></form>')
  +'<button class="edt" style="position:absolute;top:10px;right:44px" title="Rename" onclick="Train.renId=\''+e.id+'\';R(\'train\')">'+ICO.pen+'</button>'
  +'<button class="del" style="position:absolute;top:10px;right:10px" title="Remove" onclick="Train.delEx(\''+e.id+'\')">'+ICO.trash+'</button></div>'},
 best(name){let mx=0;this.wos().forEach(w=>this.wExs(w).forEach(it=>{if(it.ex===name)it.sets.forEach(s=>{mx=Math.max(mx,e1rm(+s.w||0,+s.r||0))})}));return mx},
 setRef(id,k,v){const a=this.exs();const e=a.find(x=>x.id===id);if(e){e[k]=v.trim();DB.set('ex',a)}},
 toggleCues(){const c=DB.get('cfg',{});c.cuesOff=!c.cuesOff;DB.set('cfg',c);R('train')},
 hidTip(exId,tId,hid){const a=this.exs();const e=a.find(x=>x.id===exId);
  if(e){const t=e.tips.find(x=>x.id===tId);if(t){t.hid=hid;DB.set('ex',a)}}R('train')},
 addEx(f){const n=new FormData(f).get('n').trim();const a=this.exs();
  if(a.find(e=>e.name.toLowerCase()===n.toLowerCase())){toast('Already in the library');return false}
  a.push({id:uid(),name:n,tips:[]});DB.set('ex',a);R('train');return false},
 async delEx(id){if(!await confirmUI('Remove from library? Past sessions stay in history.'))return;
  DB.set('ex',this.exs().filter(e=>e.id!==id));R('train')},
 addTip(f,exId){const t=new FormData(f).get('t').trim();const a=this.exs();
  const e=a.find(x=>x.id===exId);if(e){e.tips.push({id:uid(),x:t,hid:false});DB.set('ex',a)}
  delete this.tipDraft[exId];R('train');return false},
 delTip(exId,tId){const a=this.exs();const e=a.find(x=>x.id===exId);
  if(e){e.tips=e.tips.filter(t=>t.id!==tId);DB.set('ex',a)}R('train')},
 doRen(f,id){const nn=new FormData(f).get('n').trim();if(!nn)return false;
  const exs=this.exs();const e=exs.find(x=>x.id===id);if(!e)return false;
  const old=e.name;this.renId=null;
  if(nn===old){R('train');return false}
  if(exs.find(x=>x.name.toLowerCase()===nn.toLowerCase()&&x.id!==id)){toast('Name already exists','err');R('train');return false}
  e.name=nn;DB.set('ex',exs);
  const wos=this.wos();wos.forEach(w=>{if(w.ex===old)w.ex=nn;
   if(w.exs)w.exs.forEach(it=>{if(it.ex===old)it.ex=nn})});DB.set('wos',wos);
  const cur=this.cur();cur.forEach(it=>{if(it.ex===old)it.ex=nn});DB.set('cur',cur);
  const rs=DB.get('routines',[]);rs.forEach(r=>r.items.forEach(it=>{if(it.ex===old)it.ex=nn}));DB.set('routines',rs);
  const c=DB.get('cfg',{});if(c.prog){c.prog.lifts.forEach(L=>{if(L.name===old)L.name=nn});DB.set('cfg',c)}
  toast('Renamed — history, routines & current session updated');R('train');return false},
 /* ── PROGRESS PICS ── */
 t_progress(el){const pics=this.pics().slice().sort((a,b)=>b.d.localeCompare(a.d));
  el.innerHTML=
  '<form class="card row" onsubmit="return Train.addPic(this)"><span id="trPicBtn">'+this.picBtnHTML()+'</span>'
  +'<input class="inp" name="note" placeholder="Note — start with YYYY-MM-DD to set the photo\u2019s date" style="flex:1;margin:0"><button class="btn">Save</button></form>'
  +(this.picks.length?'<div class="cmpBar">'+this.picks.length+'/2 selected '+(this.picks.length===2?'<button class="btn sm" onclick="Train.compare()">Compare</button>':'<span class="mut">Pick one more</span>')+' <button class="btn ghost sm" onclick="Train.picks=[];R(\'train\')">Clear</button></div>':'')
  +'<div class="pgrid">'+(pics.map(p=>'<figure class="pic '+(this.picks.includes(p.id)?'sel':'')+'" onclick="Train.pickPic(\''+p.id+'\')"><img src="'+p.ph+'" alt=""><figcaption class="mono">'+p.d+(p.note?' · '+esc(p.note):'')+'<button class="x" style="float:right" onclick="event.stopPropagation();Train.delPic(\''+p.id+'\')">✕</button></figcaption></figure>').join('')||'<div class="empty" style="grid-column:1/-1">Monthly progress shots make the compounding visible. Click two photos to compare A/B.</div>')+'</div>'},
 picBtnHTML(){return '<button type="button" class="btn ghost" onclick="Img.pick(u=>Train.pic(u))">📷 '+(this.tmp?'✓ shot ready — save it':'Take / pick photo')+'</button>'},
 pic(u){this.tmp=u;const w=$('#trPicBtn');if(w)w.innerHTML=this.picBtnHTML()},
 addPic(f){if(!this.tmp){toast('Pick a photo first','err');return false}
  let note=new FormData(f).get('note').trim();let d=TODAY();
  const m=note.match(/^(\d{4}-\d{2}-\d{2})\s*/);
  if(m&&!isNaN(new Date(m[1]+'T12:00'))){d=m[1];note=note.slice(m[0].length).trim()}
  const a=this.pics();a.push({id:uid(),d,ph:this.tmp,note});
  if(DB.set('pics',a)){this.tmp=null;this.picks=[];toast('Progress photo saved · '+dayLbl(d));R('train')}return false},
 pickPic(id){const i=this.picks.indexOf(id);
  if(i>-1)this.picks.splice(i,1);else if(this.picks.length<2)this.picks.push(id);R('train')},
 compare(){const ps=this.picks.map(id=>this.pics().find(p=>p.id===id)).filter(Boolean);
  if(ps.length!==2)return;
  $('#cmp').innerHTML='<div class="cmpIn">'+ps.map(p=>'<figure><img src="'+p.ph+'"><figcaption class="mono">'+p.d+(p.note?' · '+esc(p.note):'')+'</figcaption></figure>').join('')+'</div>';
  $('#cmp').classList.add('on')},
 async delPic(id){if(!await confirmUI('Delete this progress photo?'))return;
  this.picks=this.picks.filter(p=>p!==id);
  DB.set('pics',this.pics().filter(p=>p.id!==id));R('train')},
 /* ── MEASUREMENTS ── */
 t_measure(el){const ms=this.meas().slice().sort((a,b)=>b.d.localeCompare(a.d)||((b.ts||0)-(a.ts||0)));
  const today=ms.find(m=>m.d===TODAY());
  el.innerHTML=
  '<div class="card"><div class="cHead"><b>Quick log</b><span class="mut">'+dayLbl(TODAY())+' · tap any one, no need to fill the rest</span></div>'
  +this.MFIELDS.map(f=>this.quickRow(f,today)).join('')
  +'<label class="lbl" style="margin-top:10px">Note for today</label>'
  +'<div class="row" style="margin:0"><input class="inp" id="q_note" placeholder="Note (optional)" value="'+esc(today&&today.note||'')+'" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\'){Train.saveNote();event.preventDefault()}"><button class="btn ghost sm" onclick="Train.saveNote()">Save note</button></div>'
  +'</div>'
  +this.bfCard(ms)
  +'<div class="dHead">History</div>'
  +(ms.length?ms.map(m=>this.mRow(m)).join(''):'<div class="empty">No measurements yet — log your first above.</div>')},
 quickRow(f,today){const v=today&&today[f[0]]!=null?today[f[0]]:'';
  return '<div class="row setRow" style="align-items:center"><span class="lbl" style="width:88px;margin:0">'+f[1]+'</span>'
  +'<input class="inp mono" id="q_'+f[0]+'" type="number" step="0.1" min="0" placeholder="'+f[2]+'" value="'+v+'" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\'){Train.quickLog(\''+f[0]+'\');event.preventDefault()}">'
  +'<button type="button" class="btn ghost sm" onclick="Train.quickLog(\''+f[0]+'\')">Save</button></div>'},
 quickLog(field){const inp=$('#q_'+field);if(!inp)return;
  const raw=inp.value.trim();if(raw===''){toast('Enter a value first','err');return}
  const v=+raw;if(isNaN(v)){toast('Not a number','err');return}
  const ms=this.meas();let rec=ms.find(m=>m.d===TODAY());
  if(rec){rec[field]=v;rec.ts=Date.now()}
  else{rec={id:uid(),d:TODAY(),ts:Date.now(),note:''};rec[field]=v;ms.push(rec)}
  if(DB.set('meas',ms)){toast(this.MFIELDS.find(f=>f[0]===field)[1]+' logged');R('train')}},
 saveNote(){const inp=$('#q_note');const note=inp?inp.value.trim():'';
  const ms=this.meas();let rec=ms.find(m=>m.d===TODAY());
  if(!rec){if(!note)return;rec={id:uid(),d:TODAY(),ts:Date.now()};ms.push(rec)}
  rec.note=note;
  if(DB.set('meas',ms)){toast('Note saved');R('train')}},
 bfLatest(ms,k){const m=ms.find(x=>x[k]!=null);return m?+m[k]:null},
 bodyFat(ms){const c=DB.get('cfg',{});const sex=c.sex||'m';const h=+c.height||0;
  const w=this.bfLatest(ms,'w'),waist=this.bfLatest(ms,'waist'),neck=this.bfLatest(ms,'neck'),
   hip=this.bfLatest(ms,'hips'),wrist=this.bfLatest(ms,'wrist'),forearm=this.bfLatest(ms,'forearm');
  const results=[];
  if(waist!=null&&neck!=null&&h){
   if(sex==='f'&&hip!=null){const v=495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(h))-450;
    if(isFinite(v)&&v>0)results.push({label:'US Navy',v})}
   else if(sex==='m'&&waist>neck){const v=495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(h))-450;
    if(isFinite(v)&&v>0)results.push({label:'US Navy',v})}}
  if(sex==='f'&&w!=null&&wrist!=null&&waist!=null&&hip!=null&&forearm!=null){
   const wIn=w*2.20462,waistIn=waist/2.54,hipIn=hip/2.54,wristIn=wrist/2.54,forearmIn=forearm/2.54;
   const lbm=wIn*0.732+8.987+wristIn/3.140-waistIn*0.157-hipIn*0.249+forearmIn*0.434;
   const v=(wIn-lbm)/wIn*100;
   if(isFinite(v)&&v>0)results.push({label:'Wrist-based (LBM)',v})}
  else if(sex==='m'&&w!=null&&waist!=null){
   const wIn=w*2.20462,waistIn=waist/2.54;
   const v=(waistIn*4.15-wIn*0.082-98.42)/wIn*100;
   if(isFinite(v)&&v>0)results.push({label:'YMCA',v})}
  if(!results.length)return null;
  const best=results.reduce((a,b)=>b.v>a.v?b:a);
  return{best,all:results}},
 bfCard(ms){const c=DB.get('cfg',{});
  if(!c.height)return '<div class="card li2"><span class="mut" style="font-size:12.5px">Set sex + height in Settings to auto-calculate body fat %.</span></div>';
  const r=this.bodyFat(ms);
  if(!r)return '<div class="card li2"><span class="mut" style="font-size:12.5px">Log weight, waist, neck'+(c.sex==='f'?' + hips':'')+' to auto-calculate body fat %.</span></div>';
  return '<div class="card li2"><div class="cHead"><b>Estimated body fat</b><span class="mono" style="color:var(--green)">'+r.best.v.toFixed(1)+'% · '+r.best.label+'</span></div>'
  +'<div class="mut" style="font-size:12px">'+r.all.map(x=>x.label+' '+x.v.toFixed(1)+'%').join(' · ')+' — higher shown above, no manual entry needed</div></div>'},
 mRow(m){return '<div class="card li2"><div class="row" style="margin:0;align-items:center"><div class="liB"><b>'+dayLbl(m.d)+(m.d===TODAY()?' · today':'')+'</b>'
  +'<span class="mono mut" style="font-size:12px">'+this.MFIELDS.filter(f=>m[f[0]]!=null).map(f=>f[1]+' '+m[f[0]]+f[2]).join(' · ')+'</span>'
  +(m.note?'<span>'+esc(m.note)+'</span>':'')+'</div>'
  +'<button class="del" title="Delete" onclick="Train.delMeas(\''+m.id+'\')">'+ICO.trash+'</button></div></div>'},
 /* ── dashboard hooks ── */
 stats(){const w=this.wos();const wk=w.filter(x=>x.d>=monday()).length;
  const p=this.prog(),i=this.info(),pl=this.plan();
  const sub='C'+i.cyc+' W'+(i.ph+1)+' '+p.ph[i.ph].n+' · '+(pl.length?pl.map(x=>x.ex).join(' + '):'rest day');
  return{label:'sessions · wk',v:wk,sub:sub.length>44?sub.slice(0,44)+'…':sub,c:'var(--green)'}},
 quick:{label:'+ Session',fn:"go('train')"}};
Module({id:'train',name:'Training',short:'Train',icon:'🏋',tab:true,render:v=>Train.render(v),stats:()=>Train.stats(),quick:Train.quick});
</script>

<style>
.cfmWrap{position:fixed;inset:0;z-index:80;background:rgba(4,9,15,.72);display:grid;place-items:center;opacity:0;transition:.18s}
.cfmWrap.on{opacity:1}
